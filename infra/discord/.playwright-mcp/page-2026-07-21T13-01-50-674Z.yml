              - text: are possible sources or cognates.
              - superscript [ref=e485]:
                - link "[6]" [ref=e486] [cursor=pointer]:
                  - /url: "#cite_note-6"
            - paragraph [ref=e487]:
              - text: The forms might also have derived from an ancient Germanic word that was absorbed into Latin and then into Greek, Syriac, and Arabic.
              - superscript [ref=e488]:
                - link "[7]" [ref=e489] [cursor=pointer]:
                  - /url: "#cite_note-7"
              - text: The word may be derived from Germanic and Northern European languages, and ultimately be borrowed from
              - link "Uralic" [ref=e490] [cursor=pointer]:
