            - paragraph [ref=e522]:
              - text: A male cat is called a tom, tommy or tomcat
              - superscript [ref=e523]:
                - link "[11]" [ref=e524] [cursor=pointer]:
                  - /url: "#cite_note-11"
              - text: (or a gib,
              - superscript [ref=e525]:
                - link "[12]" [ref=e526] [cursor=pointer]:
                  - /url: "#cite_note-12"
              - text: if
              - link "neutered" [ref=e527] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Neutering
              - text: ). A female is called a queen (or sometimes a molly,
              - superscript [ref=e528]:
                - link "[13]" [ref=e529] [cursor=pointer]:
                  - /url: "#cite_note-13"
              - text: if
              - link "spayed" [ref=e530] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Spaying
              - text: ).
              - superscript [ref=e531]:
                - link "[14]" [ref=e532] [cursor=pointer]:
                  - /url: "#cite_note-14"
              - text: Some sources write that queen refers solely to unspayed cats that are in an
              - link "estrous cycle" [ref=e533] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Estrous_cycle
              - text: .
              - superscript [ref=e534]:
                - link "[15]" [ref=e535] [cursor=pointer]:
                  - /url: "#cite_note-15"
              - text: A juvenile cat is referred to as a kitten (shortened to kitty in
              - link "British English" [ref=e536] [cursor=pointer]:
