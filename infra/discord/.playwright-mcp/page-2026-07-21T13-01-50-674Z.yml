              - superscript [ref=e537]:
                - link "[16]" [ref=e538] [cursor=pointer]:
                  - /url: "#cite_note-16"
              - text: ), a term interchangeable with the now-obsolete word catling in
              - link "Early Modern English" [ref=e539] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Early_Modern_English
              - text: .
              - superscript [ref=e540]:
                - link "[17]" [ref=e541] [cursor=pointer]:
                  - /url: "#cite_note-17"
              - text: A group of cats can be referred to as a clowder, a glaring,
              - superscript [ref=e542]:
                - link "[18]" [ref=e543] [cursor=pointer]:
                  - /url: "#cite_note-18"
              - text: or a colony.
