          - region [ref=e546]:
            - heading "Taxonomy" [level=2] [ref=e548]
            - paragraph [ref=e549]:
              - text: The
              - link "scientific name" [ref=e550] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Scientific_name
              - text: Felis catus was proposed by
              - link "Carl Linnaeus" [ref=e551] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Carl_Linnaeus
              - text: in 1758 for a domestic cat.
              - superscript [ref=e552]:
                - link "[1]" [ref=e553] [cursor=pointer]:
                  - /url: "#cite_note-Linnaeus1758-1"
              - superscript [ref=e554]:
                - link "[2]" [ref=e555] [cursor=pointer]:
                  - /url: "#cite_note-MSW3fc-2"
              - text: Felis catus domesticus was proposed by
              - link "Johann Christian Polycarp Erxleben" [ref=e556] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Johann_Christian_Polycarp_Erxleben
              - text: in 1777.
              - superscript [ref=e557]:
                - link "[3]" [ref=e558] [cursor=pointer]:
                  - /url: "#cite_note-Erxleben-3"
              - text: Felis daemon proposed by
              - link "Konstantin Satunin" [ref=e559] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Konstantin_Satunin
              - text: in 1904 was a black cat from the
              - link "Transcaucasus" [ref=e560] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Transcaucasus
              - text: ", later identified as a domestic cat."
              - superscript [ref=e561]:
                - link "[20]" [ref=e562] [cursor=pointer]:
                  - /url: "#cite_note-20"
              - superscript [ref=e563]:
                - link "[21]" [ref=e564] [cursor=pointer]:
                  - /url: "#cite_note-21"
            - paragraph [ref=e565]:
              - text: In 2003, the
              - link "International Commission on Zoological Nomenclature" [ref=e566] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/International_Commission_on_Zoological_Nomenclature
              - text: conserved the name silvestris Erxleben 1777 for the
              - link "wildcat" [ref=e567] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Wildcat
              - text: ", but did not suppress catus Linnaeus 1758."
              - superscript [ref=e568]:
                - link "[22]" [ref=e569] [cursor=pointer]:
                  - /url: "#cite_note-ICZN-22"
              - superscript [ref=e570]:
                - link "[23]" [ref=e571] [cursor=pointer]:
                  - /url: "#cite_note-Gentry-23"
              - text: In 2007, the modern domesticated subspecies F. silvestris catus was sampled worldwide and considered to have probably descended from the
              - link "African wildcat" [ref=e572] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/African_wildcat
              - text: (F. lybica), following results of
              - link "phylogenetic" [ref=e573] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Phylogenetic
              - text: research.
              - superscript [ref=e574]:
                - link "[24]" [ref=e575] [cursor=pointer]:
                  - /url: "#cite_note-Driscoll-24"
              - superscript [ref=e576]:
                - link "[25]" [ref=e577] [cursor=pointer]:
                  - /url: "#cite_note-MSW3fs-25"
              - superscript [ref=e578]:
                - link "[a]" [ref=e579] [cursor=pointer]:
                  - /url: "#cite_note-26"
              - text: In 2017, the IUCN Cat Classification Taskforce, following the recommendation of Gentry et al. (2004)
              - superscript [ref=e580]:
                - link "[23]" [ref=e581] [cursor=pointer]:
                  - /url: "#cite_note-Gentry-23"
              - text: that names based on domestic forms be used for domestic derivatives of wild species, regarded the domestic cat as a distinct species, Felis catus.
              - superscript [ref=e582]:
                - link "[26]" [ref=e583] [cursor=pointer]:
                  - /url: "#cite_note-27"
