            - region [ref=e915]:
              - heading "Domestication" [level=3] [ref=e917]
              - note [ref=e918]:
                - text: "See also:"
                - link "Domestication of the cat" [ref=e919] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Domestication_of_the_cat
                - text: and
                - link "Cats in ancient Egypt" [ref=e920] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cats_in_ancient_Egypt
              - figure [ref=e921]:
                - link [ref=e922] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Tomb_of_Nakht_(7).jpg
                - generic [ref=e924]:
                  - text: A cat eats a fish under a chair, in a
                  - link "mural" [ref=e925] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Mural
                  - text: in an Egyptian tomb dating to the 15th century BCE.
              - paragraph [ref=e926]:
                - text: It was long thought that the
                - link "domestication of the cat" [ref=e927] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Domestication_of_the_cat
                - text: began in
                - link "ancient Egypt" [ref=e928] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ancient_Egypt
                - text: ", where cats were venerated from around 3100"
                - link "BCE" [ref=e929] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Before_Common_Era
                - text: .
                - superscript [ref=e930]:
                  - link "[38]" [ref=e931] [cursor=pointer]:
                    - /url: "#cite_note-39"
                - superscript [ref=e932]:
                  - link "[39]" [ref=e933] [cursor=pointer]:
                    - /url: "#cite_note-40"
                - text: However, the earliest known indication for the
                - link "taming" [ref=e934] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Taming
                - text: of an African wildcat was
                - link "excavated" [ref=e935] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Excavation_(archaeology)
                - text: close by a human
                - link "Neolithic" [ref=e936] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Neolithic
                - text: grave in
                - link "Shillourokambos" [ref=e937] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Shillourokambos
                - text: ", southern"
                - link "Cyprus" [ref=e938] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cyprus
                - text: ", dating to about 7500–7200 BCE. Since there is no evidence of native mammalian"
                - link "fauna" [ref=e939] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fauna
                - text: on Cyprus, the inhabitants of this village most likely brought the cat and other wild mammals to the island from the West Asian mainland.
                - superscript [ref=e940]:
                  - link "[40]" [ref=e941] [cursor=pointer]:
                    - /url: "#cite_note-Vigne_al2004-41"
                - text: Scientists therefore assume that African wildcats were attracted to early human settlements in the
                - link "Fertile Crescent" [ref=e942] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fertile_Crescent
                - text: by rodents, in particular the
                - link "house mouse" [ref=e943] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/House_mouse
                - text: (Mus musculus), and were tamed by Neolithic farmers. This
                - link "mutual" [ref=e944] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mutualism_(biology)
                - text: relationship between early farmers and tamed cats lasted thousands of years. As
                - link "agricultural practices" [ref=e945] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Agricultural_practices
                - text: spread, so did tame and domesticated cats.
                - superscript [ref=e946]:
                  - link "[37]" [ref=e947] [cursor=pointer]:
                    - /url: "#cite_note-DriscollMenotti-Raymond2007-38"
                - superscript [ref=e948]:
                  - link "[41]" [ref=e949] [cursor=pointer]:
                    - /url: "#cite_note-Driscoll_al2009-42"
                - text: Wildcats of Egypt contributed to the maternal
                - link "gene pool" [ref=e950] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gene_pool
                - text: of the domestic cat at a later time.
                - superscript [ref=e951]:
                  - link "[42]" [ref=e952] [cursor=pointer]:
                    - /url: "#cite_note-OttoniVan_Neer2017-43"
              - paragraph [ref=e953]:
                - text: The earliest known evidence for the occurrence of the domestic cat in Greece dates to around 1200 BCE. Greek,
                - link "Phoenician" [ref=e954] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Phoenicia
                - text: ","
                - link "Carthaginian" [ref=e955] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Carthaginia
                - text: and
                - link "Etruscan" [ref=e956] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Etrusca
                - text: traders introduced it to southern Europe.
                - superscript [ref=e957]:
                  - link "[43]" [ref=e958] [cursor=pointer]:
                    - /url: "#cite_note-Faure2009-44"
                - text: By the 5th century BCE, it was a familiar animal around settlements in
                - link "Magna Graecia" [ref=e959] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Magna_Graecia
                - text: and
                - link "Etruria" [ref=e960] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Etruria
                - text: .
                - superscript [ref=e961]:
                  - link "[44]" [ref=e962] [cursor=pointer]:
                    - /url: "#cite_note-45"
                - text: During the
                - link "Roman Empire" [ref=e963] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Roman_Empire
                - text: ", it was introduced to"
                - link "Corsica" [ref=e964] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Corsica
                - text: and
                - link "Sardinia" [ref=e965] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sardinia
                - text: .
                - superscript [ref=e966]:
                  - link "[45]" [ref=e967] [cursor=pointer]:
                    - /url: "#cite_note-Vigne1992-46"
                - text: By the end of the
                - link "Western Roman Empire" [ref=e968] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Western_Roman_Empire
                - text: in the 5th century, the Egyptian domestic cat lineage had arrived in a
                - link "Baltic Sea" [ref=e969] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Baltic_Sea
                - text: port in northern Germany.
                - superscript [ref=e970]:
                  - link "[42]" [ref=e971] [cursor=pointer]:
                    - /url: "#cite_note-OttoniVan_Neer2017-43"
              - paragraph [ref=e972]:
                - text: The
                - link "leopard cat" [ref=e973] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Leopard_cat
                - text: (Prionailurus bengalensis) was
                - link "tamed" [ref=e974] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tamed
                - text: independently in China around 5500 BCE. This line of a partially domesticated cat left no trace in the domestic cat populations of today.
                - superscript [ref=e975]:
                  - link "[46]" [ref=e976] [cursor=pointer]:
                    - /url: "#cite_note-47"
              - paragraph [ref=e977]:
                - text: During domestication, cats have undergone only minor changes in anatomy and behavior, and they are still capable of surviving in the wild. Several natural behaviors and characteristics of wildcats may have
                - link "pre-adapted" [ref=e978] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Preadaptation
                - text: them for domestication as pets. These traits include their small size, social nature, obvious body language, love of play, and high intelligence. Their rigorous grooming habits and instinct to bury their bodily waste make them generally much less messy than other domesticated animals. Captive
                - link "Leopardus" [ref=e980] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Leopardus
                - text: cats may also display affectionate behavior toward humans but are not domesticated.
                - superscript [ref=e981]:
                  - link "[47]" [ref=e982] [cursor=pointer]:
                    - /url: "#cite_note-CameronBeaumont-48"
                - text: House cats may mate with feral cats.
                - superscript [ref=e983]:
                  - link "[48]" [ref=e984] [cursor=pointer]:
                    - /url: "#cite_note-Bradshaw1999-49"
              - paragraph [ref=e985]:
                - text: The development of
                - link "cat breeds" [ref=e986] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_breeds
                - text: started in the mid-19th century.
                - superscript [ref=e987]:
                  - link "[49]" [ref=e988] [cursor=pointer]:
                    - /url: "#cite_note-50"
                - text: An analysis of the domestic cat
                - link "genome" [ref=e989] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Genome
                - text: revealed that the ancestral wildcat genome was significantly altered in the process of domestication, as specific
                - link "mutations" [ref=e990] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mutation
                - text: were selected to develop cat breeds.
                - superscript [ref=e991]:
                  - link "[50]" [ref=e992] [cursor=pointer]:
                    - /url: "#cite_note-51"
                - text: Most breeds are founded on random-bred domestic cats;
                - link "genetic diversity" [ref=e993] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Genetic_diversity
                - text: of these breeds varies between regions, and is lowest in purebred populations, which show more than 20 deleterious
                - link "genetic disorders" [ref=e994] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Genetic_disorder
                - text: .
                - superscript [ref=e995]:
                  - link "[51]" [ref=e996] [cursor=pointer]:
                    - /url: "#cite_note-Lipinski-52"
                - link "Hybridization between domestic and other Felinae species" [ref=e997] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Felid_hybrid#Domestic_cat_and_hybridization
                - text: is also possible, producing hybrids such as the
                - link "Kellas cat" [ref=e998] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kellas_cat
                - text: in Scotland.
                - superscript [ref=e999]:
                  - link "[52]" [ref=e1000] [cursor=pointer]:
                    - /url: "#cite_note-Oliveira-53"
                - superscript [ref=e1001]:
                  - link "[53]" [ref=e1002] [cursor=pointer]:
                    - /url: "#cite_note-54"
          - region [ref=e1003]:
            - heading "Characteristics" [level=2] [ref=e1005]
            - note [ref=e1006]:
              - text: "Main article:"
              - link "Cat anatomy" [ref=e1007] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cat_anatomy
            - region [ref=e1008]:
              - heading "Size" [level=3] [ref=e1010]
              - figure [ref=e1011]:
                - link [ref=e1012] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Scheme_cat_anatomy.svg
                - generic [ref=e1014]:
                  - text: Diagram of the general
                  - link "anatomy" [ref=e1015] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Anatomy
                  - text: of a male domestic cat
              - paragraph [ref=e1016]:
                - text: The domestic cat has a smaller
                - link "skull" [ref=e1017] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Skull
                - text: and shorter bones than the
                - link "European wildcat" [ref=e1018] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/European_wildcat
                - text: .
                - superscript [ref=e1019]:
                  - link "[54]" [ref=e1020] [cursor=pointer]:
                    - /url: "#cite_note-OConnor-55"
                - text: It averages about 46 cm (18 in) in head-to-body length and 23–25 cm (9.1–9.8 in) in height, with about 30 cm (12 in) long tails. Males are larger than females.
                - superscript [ref=e1021]:
                  - link "[55]" [ref=e1022] [cursor=pointer]:
                    - /url: "#cite_note-WCoW-56"
                - text: Adult domestic cats typically weigh 4–5 kg (8.8–11.0 lb).
                - superscript [ref=e1023]:
                  - link "[30]" [ref=e1024] [cursor=pointer]:
                    - /url: "#cite_note-Mattern-31"
            - region [ref=e1025]:
              - heading "Skeleton" [level=3] [ref=e1027]
              - paragraph [ref=e1028]:
                - text: Cats have seven
                - link "cervical vertebrae" [ref=e1029] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cervical_vertebrae
                - text: (as do most
                - link "mammals" [ref=e1030] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mammal
                - text: ); 13
                - link "thoracic vertebrae" [ref=e1031] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Thoracic_vertebrae
                - text: (humans have 12); seven
                - link "lumbar vertebrae" [ref=e1032] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lumbar_vertebrae
                - text: (humans have five); three
                - link "sacral vertebrae" [ref=e1033] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sacrum
                - text: (as do most mammals, but humans have five); and a variable number of
                - link "caudal vertebrae" [ref=e1034] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Caudal_vertebrae
                - text: in the tail (humans have only three to five vestigial caudal vertebrae, fused into an internal
                - link "coccyx" [ref=e1035] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coccyx
                - text: ).
                - superscript [ref=e1036]:
                  - link "[56]" [ref=e1037] [cursor=pointer]:
                    - /url: "#cite_note-Walker-57"
                - superscript [ref=e1038]:
                  - 'generic "Page / location: 11" [ref=e1039]': ": 11"
                - text: The extra lumbar and thoracic vertebrae account for the cat's spinal mobility and flexibility. Attached to the spine are 13 ribs, the shoulder, and the
                - link "pelvis" [ref=e1040] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pelvis
                - text: .
                - superscript [ref=e1041]:
                  - link "[56]" [ref=e1042] [cursor=pointer]:
                    - /url: "#cite_note-Walker-57"
                - superscript [ref=e1043]:
                  - 'generic "Page / location: 16" [ref=e1044]': ": 16"
                - text: Unlike human arms, cat forelimbs are attached to the shoulder by free-floating
                - link "clavicle" [ref=e1045] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Clavicle
                - text: bones which allow them to pass their body through any space into which they can fit their head.
                - superscript [ref=e1046]:
                  - link "[57]" [ref=e1047] [cursor=pointer]:
                    - /url: "#cite_note-Gillis_2002-58"
            - region [ref=e1048]:
              - heading "Skull" [level=3] [ref=e1050]
              - figure "Cat skull" [ref=e1051]:
                - link [ref=e1052] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Cat_skull.jpg
              - paragraph [ref=e1055]:
                - text: The cat skull is unusual among mammals in having very large
                - link "eye sockets" [ref=e1056] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eye_socket
                - text: and a powerful specialized jaw.
                - superscript [ref=e1057]:
                  - link "[58]" [ref=e1058] [cursor=pointer]:
                    - /url: "#cite_note-Case-59"
                - superscript [ref=e1059]:
                  - 'generic "Page / location: 35" [ref=e1060]': ": 35"
                - text: Two long
                - link "canine teeth" [ref=e1061] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Canine_tooth
                - text: for killing and tearing prey can stab between two of the prey's
                - link "vertebrae" [ref=e1062] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vertebra
                - text: and sever its
                - link "spinal cord" [ref=e1063] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Spinal_cord
                - text: ", causing"
                - link "paralysis" [ref=e1064] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Paralysis
                - text: and death.
                - superscript [ref=e1065]:
                  - link "[59]" [ref=e1066] [cursor=pointer]:
                    - /url: "#cite_note-Smith1992-60"
                - text: Compared to other felines, domestic cats have narrowly spaced canine teeth relative to the size of their jaw, which is an adaptation to their preferred prey of small rodents, which have small vertebrae.
                - superscript [ref=e1067]:
                  - link "[59]" [ref=e1068] [cursor=pointer]:
                    - /url: "#cite_note-Smith1992-60"
              - paragraph [ref=e1069]:
                - text: The
                - link "premolar" [ref=e1070] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Premolar
                - text: and first
                - link "molar" [ref=e1071] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Molar_(tooth)
                - text: together compose the
                - link "carnassial" [ref=e1072] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Carnassial
                - text: pair on each side of the mouth, which efficiently shears meat into small pieces, like a pair of scissors. These are vital in feeding, because cats' small molars cannot chew food effectively, and cats are largely incapable of mastication.
                - superscript [ref=e1073]:
                  - link "[58]" [ref=e1074] [cursor=pointer]:
                    - /url: "#cite_note-Case-59"
                - superscript [ref=e1075]:
                  - 'generic "Page / location: 37" [ref=e1076]': ": 37"
                - text: Cats tend to have better dental health than most humans, with decay generally less likely because of a thicker protective layer of
                - link "enamel" [ref=e1077] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tooth_enamel
                - text: ", a less damaging saliva, less retention of food particles between teeth, and a diet mostly devoid of sugar. Nonetheless, they are subject to occasional tooth loss and infection."
                - superscript [ref=e1078]:
                  - link "[60]" [ref=e1079] [cursor=pointer]:
                    - /url: "#cite_note-Carr1978-61"
            - region [ref=e1080]:
              - heading "Claws" [level=3] [ref=e1082]
              - figure "Cat's claw" [ref=e1083]:
                - link [ref=e1084] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Cat_claw_closeup.jpg
              - paragraph [ref=e1087]:
                - text: Cats have protractible and retractable claws.
                - superscript [ref=e1088]:
                  - link "[61]" [ref=e1089] [cursor=pointer]:
                    - /url: "#cite_note-Kitchener2010-62"
                - text: In their normal, relaxed position, the claws are sheathed with the skin and fur around the paw's toe pads. This keeps the claws sharp by preventing wear from contact with the ground and allows for the silent stalking of prey. The claws on the forefeet are typically sharper than those on the hindfeet.
                - superscript [ref=e1090]:
                  - link "[62]" [ref=e1091] [cursor=pointer]:
                    - /url: "#cite_note-Armes_1900-63"
                - text: Cats can voluntarily extend their claws, such as in hunting, fighting, climbing,
                - link "kneading" [ref=e1092] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kneading_(cats)
                - text: ", or for extra traction on soft surfaces. Cats shed the outside layer of their claw sheaths when scratching rough surfaces."
                - superscript [ref=e1093]:
                  - link "[63]" [ref=e1094] [cursor=pointer]:
                    - /url: "#cite_note-pmid19422432-64"
              - paragraph [ref=e1095]:
                - text: Most cats have five claws on their front paws and four on their rear paws. The
                - link "dewclaw" [ref=e1096] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dewclaw
                - text: is
                - link "proximal" [ref=e1097] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Proximal
                - text: to the other claws. More proximally is a protrusion which appears to be a sixth "finger". This special feature of the front paws on the inside of the wrists has no function in normal walking but is thought to be an antiskidding device used while jumping. Some cat breeds are prone to having extra digits ("
                - link "polydactyly" [ref=e1098] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Polydactyl_cat
                - text: "\")."
                - superscript [ref=e1099]:
                  - link "[64]" [ref=e1100] [cursor=pointer]:
                    - /url: "#cite_note-Danforth1947-65"
            - region [ref=e1101]:
              - heading "Ambulation" [level=3] [ref=e1103]
              - paragraph [ref=e1104]:
                - text: The cat is
                - link "digitigrade" [ref=e1105] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Digitigrade
                - text: . It walks on the toes, with the bones of the feet making up the lower part of the visible leg.
                - superscript [ref=e1106]:
                  - link "[65]" [ref=e1107] [cursor=pointer]:
                    - /url: "#cite_note-Pocock1917-66"
                - text: Unlike most mammals, it uses a "pacing"
                - link "gait" [ref=e1108] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gait
                - text: "that alternates both legs together on each side. It registers directly by placing each hind paw close to the track of the corresponding fore paw, minimizing noise and visible tracks. This also provides sure footing for hind paws when navigating rough terrain. As it speeds up from walking to trotting, its gait changes to a \"diagonal\" gait: The diagonally opposite hind and fore legs move simultaneously."
                - superscript [ref=e1109]:
                  - link "[66]" [ref=e1110] [cursor=pointer]:
                    - /url: "#cite_note-Christensen_2004-67"
            - region [ref=e1111]:
              - heading "Balance" [level=3] [ref=e1113]
              - figure "A cat is perched on a tree branch, having climbed up for exploration, escape, or hunting." [ref=e1114]:
                - link [ref=e1115] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Cat_in_tree03.jpg
              - paragraph [ref=e1118]:
                - text: Cats are generally fond of perching in high places. This may be a concealed hunting site such as a tree branch, for domestic cats to pounce upon prey. They favor a superior observation point over territory. A cat falling from up to 3 m (9.8 ft) can right itself and land on its paws.
                - superscript [ref=e1119]:
                  - link "[67]" [ref=e1120] [cursor=pointer]:
                    - /url: "#cite_note-Kent_et_al._2010-68"
              - paragraph [ref=e1121]:
                - text: During a lofty fall, a cat reflexively twists and rights itself to land on its feet using its acute sense of balance and flexibility. This reflex is known as the
                - link "cat righting reflex" [ref=e1122] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_righting_reflex
                - text: .
                - superscript [ref=e1123]:
                  - link "[68]" [ref=e1124] [cursor=pointer]:
                    - /url: "#cite_note-69"
                - text: A cat always rights itself in the same way, and it has enough time in falls of at least 90 cm (3.0 ft).
                - superscript [ref=e1125]:
                  - link "[69]" [ref=e1126] [cursor=pointer]:
                    - /url: "#cite_note-Nguyen_1998-70"
                - text: This has been investigated as the "
                - link "falling cat problem" [ref=e1127] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Falling_cat_problem
                - text: "\"."
                - superscript [ref=e1128]:
                  - link "[70]" [ref=e1129] [cursor=pointer]:
                    - /url: "#cite_note-71"
            - region [ref=e1130]:
              - heading "Coats" [level=3] [ref=e1132]
              - note [ref=e1133]:
                - text: "Main article:"
                - link "Cat coat genetics" [ref=e1134] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_coat_genetics
              - note [ref=e1135]:
                - text: "See also:"
                - link "Tabby cat" [ref=e1136] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tabby_cat
              - figure "Mother cat with her different-colored offspring" [ref=e1137]:
                - link [ref=e1138] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Nursing_Cat_01.jpg
              - paragraph [ref=e1141]:
                - text: The domestic cat genes
                - link "MC1R" [ref=e1143] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/MC1R
                - text: and
                - link "ASIP" [ref=e1145] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Agouti-signaling_protein
                - text: allow color variety in the coat. The feline ASIP gene consists of three coding exons.
                - superscript [ref=e1146]:
                  - link "[71]" [ref=e1147] [cursor=pointer]:
                    - /url: "#cite_note-72"
                - text: Three novel
                - link "microsatellite" [ref=e1148] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsatellite
                - text: markers linked to ASIP were isolated from a domestic cat BAC
                - link "clone" [ref=e1149] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Clone_(cell_biology)
                - text: containing this gene to perform
                - link "linkage analysis" [ref=e1150] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Linkage_analysis
                - text: on 89 domestic cats segregated for
                - link "melanism" [ref=e1151] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Melanism
                - text: . The domestic cat family demonstrated a
                - link "cosegregation" [ref=e1152] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cosegregation
                - text: between the ASIP allele and black coloration of the coat.
                - superscript [ref=e1153]:
                  - link "[72]" [ref=e1154] [cursor=pointer]:
                    - /url: "#cite_note-73"
            - region [ref=e1155]:
              - heading "Diet" [level=3] [ref=e1157]
              - paragraph [ref=e1158]:
                - text: The cat is an obligate carnivore and has adapted to a low-fibre highly digestible meat diet. Cats have fewer
                - link "enzymes" [ref=e1159] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Enzyme
                - text: capable of metabolising
                - link "carbohydrates" [ref=e1160] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Carbohydrates
                - text: compared to omnivores. The cat lacks the ability to convert
                - link "carotenoids" [ref=e1161] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Carotenoids
                - text: to vitamin A; has an inability to synthesise enough vitamin D; inability to synthesise
                - link "niacin" [ref=e1162] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Niacin
                - text: from
                - link "tryptophan" [ref=e1163] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tryptophan
                - text: ; inability to synthesise
                - link "cysteine" [ref=e1164] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cysteine
                - text: ","
                - link "citrulline" [ref=e1165] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Citrulline
                - text: ", and"
                - link "methionine" [ref=e1166] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Methionine
                - text: ; lacks
                - link "glucokinase" [ref=e1167] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Glucokinase
                - text: activity; and an intolerance to
                - link "glutamic acid" [ref=e1168] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Glutamic_acid
                - text: (which is low in animal tissue and high in plant matter).
                - link "Taurine" [ref=e1169] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Taurine
                - text: and
                - link "arginine" [ref=e1170] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Arginine
                - text: are essential for cats. Due to the inability to synthesise adequate amounts of citrulline a single meal lacking in arginine can be fatal to a cat. Cats cannot produce enough taurine and require dietary taurine; a lack of taurine will cause a cat to develop
                - link "dilated cardiomyopathy" [ref=e1171] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dilated_cardiomyopathy
                - text: . Commercial cat diets historically were lacking in taurine and dilated cardiomyopathy was a common issue until it was linked to taurine deficiency in a 1987 study.
                - superscript [ref=e1172]:
                  - link "[73]" [ref=e1173] [cursor=pointer]:
                    - /url: "#cite_note-Fascetti_2023-74"
          - region [ref=e1174]:
            - heading "Senses" [level=2] [ref=e1176]
            - note [ref=e1177]:
              - text: "Main article:"
              - link "Cat senses" [ref=e1178] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cat_senses
            - region [ref=e1179]:
              - heading "Vision" [level=3] [ref=e1181]
              - figure [ref=e1182]:
                - link [ref=e1183] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Tabby_cat_with_visible_nictitating_membrane.jpg
                  - img "A tabby cat with a third, translucent eyelid covering part of either eye" [ref=e1184]
                - generic [ref=e1185]:
                  - text: A cat's
                  - link "nictitating membrane" [ref=e1186] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Nictitating_membrane
                  - text: is exposed as it blinks.
              - paragraph [ref=e1187]:
                - text: Cats have excellent night vision and can see at one sixth the light level required for human vision.
                - superscript [ref=e1188]:
                  - link "[58]" [ref=e1189] [cursor=pointer]:
                    - /url: "#cite_note-Case-59"
                - superscript [ref=e1190]:
                  - 'generic "Page / location: 43" [ref=e1191]': ": 43"
                - text: This is partly the result of cat eyes having a
                - link "tapetum lucidum" [ref=e1193] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tapetum_lucidum
                - text: ", which reflects any light that passes through the"
                - link "retina" [ref=e1194] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Retina
                - text: back into the eye, thereby increasing the eye's sensitivity to dim light.
                - superscript [ref=e1195]:
                  - link "[74]" [ref=e1196] [cursor=pointer]:
                    - /url: "#cite_note-75"
                - text: Large pupils are an adaptation to dim light. The domestic cat has
                - link "slit pupils" [ref=e1197] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pupil#In_other_animals
                - text: ", which allow it to focus bright light without"
                - link "chromatic aberration" [ref=e1198] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chromatic_aberration
                - text: .
                - superscript [ref=e1199]:
                  - link "[75]" [ref=e1200] [cursor=pointer]:
                    - /url: "#cite_note-76"
                - text: At low light, a cat's pupils expand to cover most of the exposed surface of its eyes.
                - superscript [ref=e1201]:
                  - link "[76]" [ref=e1202] [cursor=pointer]:
                    - /url: "#cite_note-77"
                - text: The domestic cat has rather poor
                - link "color vision" [ref=e1203] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Color_vision
                - text: and only two types of
                - link "cone cells" [ref=e1204] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cone_cell
                - text: ", optimized for sensitivity to blue and yellowish green; its ability to distinguish between red and green is limited."
                - superscript [ref=e1205]:
                  - link "[77]" [ref=e1206] [cursor=pointer]:
                    - /url: "#cite_note-78"
                - text: A response to middle wavelengths from a system other than the
                - link "rod cells" [ref=e1207] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rod_cell
                - text: might be due to a third type of cone. This appears to be an adaptation to low light levels rather than representing true
                - link "trichromatic" [ref=e1208] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Trichromacy
                - text: vision.
                - superscript [ref=e1209]:
                  - link "[78]" [ref=e1210] [cursor=pointer]:
                    - /url: "#cite_note-79"
                - text: Cats have a
                - link "nictitating membrane" [ref=e1211] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nictitating_membrane
                - text: ", allowing them to blink without hindering their vision."
            - region [ref=e1212]:
              - heading "Hearing" [level=3] [ref=e1214]
              - paragraph [ref=e1215]:
                - text: The domestic cat's hearing is most acute in the range of 500
                - link "Hz" [ref=e1216] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hz
                - text: to 32 kHz.
                - superscript [ref=e1217]:
                  - link "[79]" [ref=e1218] [cursor=pointer]:
                    - /url: "#cite_note-80"
                - text: It can detect an extremely broad range of frequencies ranging from 55 Hz to 79 kHz, whereas humans can only detect frequencies between 20 Hz and 20 kHz. It can hear a range of 10.5
                - link "octaves" [ref=e1219] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Octave
                - text: ", compared to about 9 octaves for humans and dogs."
                - superscript [ref=e1220]:
                  - link "[80]" [ref=e1221] [cursor=pointer]:
                    - /url: "#cite_note-81"
                - superscript [ref=e1222]:
                  - link "[81]" [ref=e1223] [cursor=pointer]:
                    - /url: "#cite_note-82"
                - text: Its hearing sensitivity is enhanced by its large movable outer ears, the
                - link "pinnae" [ref=e1224] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pinna_(anatomy)
                - text: ", which amplify sounds and help detect the location of a noise. It can detect"
                - link "ultrasound" [ref=e1225] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ultrasound
                - text: ", including ultrasonic calls from"
                - link "rodent" [ref=e1226] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rodent
                - text: prey.
                - superscript [ref=e1227]:
                  - link "[82]" [ref=e1228] [cursor=pointer]:
                    - /url: "#cite_note-Sunquist-83"
                - superscript [ref=e1229]:
                  - link "[83]" [ref=e1230] [cursor=pointer]:
                    - /url: "#cite_note-84"
                - text: Research has shown that cats have socio-spatial cognitive abilities to create mental maps of familiar people's locations based on hearing their voices.
                - superscript [ref=e1231]:
                  - link "[84]" [ref=e1232] [cursor=pointer]:
                    - /url: "#cite_note-85"
            - region [ref=e1233]:
              - heading "Smell" [level=3] [ref=e1235]
              - paragraph [ref=e1236]:
                - text: Cats have an acute sense of smell, due in part to their well-developed
                - link "olfactory bulb" [ref=e1237] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Olfactory_bulb
                - text: and a large surface of
                - link "olfactory mucosa" [ref=e1238] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Olfactory_mucosa
                - text: ", about 5.8 cm"
                - superscript [ref=e1239]: "2"
                - text: (0.90 in
                - superscript [ref=e1240]: "2"
                - text: ) in area, which is about twice that of humans.
                - superscript [ref=e1241]:
                  - link "[85]" [ref=e1242] [cursor=pointer]:
                    - /url: "#cite_note-Moulton_1967-86"
                - text: Cats and many other animals have a
                - link "Jacobson's organ" [ref=e1243] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jacobson's_organ
                - text: in their mouths that is used in the behavioral process of
                - link "flehmening" [ref=e1244] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Flehmen_response
                - text: . It allows them to sense certain aromas in a way that humans cannot. Cats are sensitive to
                - link "pheromones" [ref=e1245] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_pheromone
                - text: such as
                - link "3-mercapto-3-methylbutan-1-ol" [ref=e1246] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/3-mercapto-3-methylbutan-1-ol
                - text: ","
                - superscript [ref=e1247]:
                  - link "[86]" [ref=e1248] [cursor=pointer]:
                    - /url: "#cite_note-felinine-87"
                - text: which they use to communicate through
                - link "urine spraying" [ref=e1249] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Urine_spraying
                - text: and marking with
                - link "scent glands" [ref=e1250] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Scent_gland
                - text: .
                - superscript [ref=e1251]:
                  - link "[87]" [ref=e1252] [cursor=pointer]:
                    - /url: "#cite_note-Sommerville-88"
                - text: Many cats also respond strongly to plants that contain
                - link "nepetalactone" [ref=e1253] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nepetalactone
                - text: ", especially"
                - link "catnip" [ref=e1254] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Catnip
                - text: ", which they can detect at less than one part per billion."
                - superscript [ref=e1255]:
                  - link "[88]" [ref=e1256] [cursor=pointer]:
                    - /url: "#cite_note-89"
                - text: About 70–80% of cats are affected by nepetalactone.
                - superscript [ref=e1257]:
                  - link "[89]" [ref=e1258] [cursor=pointer]:
                    - /url: "#cite_note-90"
                - text: This response is also produced by other plants, such as silver vine (
                - link "Actinidia polygama" [ref=e1260] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Actinidia_polygama
                - text: ) and the herb
                - link "valerian" [ref=e1261] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Valerian_(herb)
                - text: ; it may be caused by the smell of these plants mimicking a pheromone and stimulating cats' social or sexual behaviors.
                - superscript [ref=e1262]:
                  - link "[90]" [ref=e1263] [cursor=pointer]:
                    - /url: "#cite_note-Tucker-91"
            - region [ref=e1264]:
              - heading "Taste" [level=3] [ref=e1266]
              - paragraph [ref=e1267]:
                - text: Cats have about 470
                - link "taste buds" [ref=e1268] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Taste_bud
                - text: ", compared to more than 9,000 on the human tongue."
                - superscript [ref=e1269]:
                  - link "[91]" [ref=e1270] [cursor=pointer]:
                    - /url: "#cite_note-sch-92"
                - text: Domestic and wild cats share a
                - link "taste receptor gene mutation" [ref=e1271] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Taste_receptor#Loss_of_function
                - text: that keeps their sweet taste buds from binding to sugary molecules, leaving them with no ability to taste
                - link "sweetness" [ref=e1272] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sweetness
                - text: .
                - superscript [ref=e1273]:
                  - link "[92]" [ref=e1274] [cursor=pointer]:
                    - /url: "#cite_note-93"
                - text: But they do have taste bud receptors specialized for
                - link "acids" [ref=e1275] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Acid
                - text: ","
                - link "amino acids" [ref=e1276] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Amino_acid
                - text: such as the constituents of protein, and bitter tastes.
                - superscript [ref=e1277]:
                  - link "[93]" [ref=e1278] [cursor=pointer]:
                    - /url: "#cite_note-Bradshaw2006-94"
              - paragraph [ref=e1279]:
                - text: Cats' taste buds possess the receptors needed to detect
                - link "umami" [ref=e1280] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Umami
                - text: . However, these receptors contain molecular changes that make them taste umami differently from humans. In humans, they detect the amino acids
                - link "glutamic acid" [ref=e1281] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Glutamic_acid
                - text: and
                - link "aspartic acid" [ref=e1282] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Aspartic_acid
                - text: ; but in cats, they instead detect
                - link "inosine monophosphate" [ref=e1283] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Inosine_monophosphate
                - text: and
                - link "histidine" [ref=e1284] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Histidine
                - text: .
                - superscript [ref=e1285]:
                  - link "[94]" [ref=e1286] [cursor=pointer]:
                    - /url: "#cite_note-McGrane_Gibbs_Hernangomez_de_Alvaro_Dunlop-95"
                - text: These molecules are particularly enriched in
                - link "tuna" [ref=e1287] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tuna
                - text: .
                - superscript [ref=e1288]:
                  - link "[94]" [ref=e1289] [cursor=pointer]:
                    - /url: "#cite_note-McGrane_Gibbs_Hernangomez_de_Alvaro_Dunlop-95"
                - text: Researchers argue why cats find tuna so
                - link "palatable" [ref=e1290] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Palatability
                - text: ": \"the specific combination of the high IMP and free histidine contents of tuna, which produces a strong umami taste synergy that is highly preferred by cats.\""
                - superscript [ref=e1291]:
                  - link "[94]" [ref=e1292] [cursor=pointer]:
                    - /url: "#cite_note-McGrane_Gibbs_Hernangomez_de_Alvaro_Dunlop-95"
                - text: One researcher said, "I think umami is as important for cats as sweet is for humans."
                - superscript [ref=e1293]:
                  - link "[95]" [ref=e1294] [cursor=pointer]:
                    - /url: "#cite_note-Science_Tuna_Cat-96"
              - paragraph [ref=e1295]:
                - text: Cats distinctly prefer food temperature around 38 °C (100 °F), similar to a fresh kill. Some cats reject cold food, which would signal to the cat that the prey is long dead and therefore possibly toxic or decomposing.
                - superscript [ref=e1296]:
                  - link "[91]" [ref=e1297] [cursor=pointer]:
                    - /url: "#cite_note-sch-92"
            - region [ref=e1298]:
              - heading "Whiskers" [level=3] [ref=e1300]
              - figure "The whiskers of a cat are highly sensitive to touch." [ref=e1301]:
                - link [ref=e1302] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Kittyply_edit1.jpg
              - paragraph [ref=e1305]:
                - text: To aid with navigation and sensation, cats have dozens of movable
                - link "whiskers (vibrissae)" [ref=e1306] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vibrissa
                - text: over their body, most prominently on their faces, as seen by the long, white lines diverging outwards from its nose. These provide information on the width of gaps and on the location of objects in the dark, both by touching objects directly and by sensing air currents. They trigger protective
                - link "blink reflexes" [ref=e1307] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Blink_reflex
                - text: to protect the eyes from damage.
                - superscript [ref=e1308]:
                  - link "[58]" [ref=e1309] [cursor=pointer]:
                    - /url: "#cite_note-Case-59"
                - superscript [ref=e1310]:
                  - 'generic "Page / location: 47" [ref=e1311]': ": 47"
          - region [ref=e1312]:
            - heading "Behavior" [level=2] [ref=e1314]
            - note [ref=e1315]:
              - text: "See also:"
              - link "Cat behavior" [ref=e1316] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cat_behavior
            - paragraph [ref=e1317]:
              - text: Outdoor cats are active both day and
              - link "night" [ref=e1318] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nocturnal_animal
              - text: ", although they tend to be slightly more active at night."
              - superscript [ref=e1319]:
                - link "[96]" [ref=e1320] [cursor=pointer]:
                  - /url: "#cite_note-97"
              - text: Domestic cats spend the majority of their time in the vicinity of their homes, but they can range a radius of many hundreds of meters. They establish
              - link "territories" [ref=e1321] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Territory_(animal)
              - text: that vary considerably in size, in one study ranging 7–28 ha (17–69 acres).
              - superscript [ref=e1322]:
                - link "[97]" [ref=e1323] [cursor=pointer]:
                  - /url: "#cite_note-98"
              - text: The timing of cats' activity is quite flexible and varied; but being low-light predators, they are generally
              - link "crepuscular" [ref=e1324] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Crepuscular_animal
              - text: ", which means they tend to be more active near dawn and dusk. However, house cats' behavior is also influenced by human activity, and they may adapt to their owners' sleeping patterns to some extent."
              - superscript [ref=e1325]:
                - link "[98]" [ref=e1326] [cursor=pointer]:
                  - /url: "#cite_note-99"
              - superscript [ref=e1327]:
                - link "[99]" [ref=e1328] [cursor=pointer]:
                  - /url: "#cite_note-100"
            - paragraph [ref=e1329]:
              - text: Cats conserve energy by sleeping more than most animals, especially as they grow older. The daily duration of sleep varies, usually between 12 and 16 hours, with 13 to 14 being the average. Some cats can sleep as much as 20 hours. The term "cat nap" for a short rest refers to the cat's tendency to fall asleep (lightly) for a brief period. Short periods of
              - link "rapid eye movement sleep" [ref=e1330] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rapid_eye_movement_sleep
              - text: are often accompanied by muscle twitches, which suggests they are dreaming.
              - superscript [ref=e1331]:
                - link "[100]" [ref=e1332] [cursor=pointer]:
                  - /url: "#cite_note-101"
            - paragraph [ref=e1333]:
              - text: Behavioral and personality traits depend on a complex interplay between genetic and environmental factors. Scientific evidence does not support the popular belief that those traits are linked to coat colors.
              - superscript [ref=e1334]:
                - link "[101]" [ref=e1335] [cursor=pointer]:
                  - /url: "#cite_note-102"
              - superscript [ref=e1336]:
                - link "[102]" [ref=e1337] [cursor=pointer]:
                  - /url: "#cite_note-103"
              - superscript [ref=e1338]:
                - link "[103]" [ref=e1339] [cursor=pointer]:
                  - /url: "#cite_note-104"
            - region [ref=e1340]:
              - heading "Sociability" [level=3] [ref=e1342]
              - paragraph [ref=e1343]:
                - text: The social behavior of the domestic cat ranges from widely dispersed individuals to
                - link "feral cat colonies" [ref=e1344] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Feral_cat_colony
                - text: that gather around a food source, based on groups of co-operating females.
                - superscript [ref=e1345]:
                  - link "[104]" [ref=e1346] [cursor=pointer]:
                    - /url: "#cite_note-Crowell-davis2004-105"
                - superscript [ref=e1347]:
                  - link "[105]" [ref=e1348] [cursor=pointer]:
                    - /url: "#cite_note-Liberg_al2014-106"
                - text: Within such groups, one cat is usually dominant over the others.
                - superscript [ref=e1349]:
                  - link "[106]" [ref=e1350] [cursor=pointer]:
                    - /url: "#cite_note-107"
                - text: Each cat in a colony holds a distinct territory, with sexually active males having the largest territories, which are about 10 times larger than those of female cats and may overlap with several females' territories. These territories are marked by
                - link "urine spraying" [ref=e1351] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Urine_spraying
                - text: ", rubbing objects at head height with secretions from facial glands, and by"
                - link "defecation" [ref=e1352] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Defecation
                - text: .
                - superscript [ref=e1353]:
                  - link "[87]" [ref=e1354] [cursor=pointer]:
                    - /url: "#cite_note-Sommerville-88"
                - text: Between these territories are neutral areas where cats watch and greet one another without territorial conflicts. Outside these neutral areas, territory holders usually chase away stranger cats, at first by staring, hissing, and
                - link "growling" [ref=e1355] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Growling
                - text: ", and, if that does not work, by short and violent, noisy attacks. Because cats do not have a social survival strategy or"
                - link "herd behavior" [ref=e1356] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Herd_behavior
                - text: ", they always hunt alone."
                - superscript [ref=e1357]:
                  - link "[107]" [ref=e1358] [cursor=pointer]:
                    - /url: "#cite_note-Bradshaw-108"
              - figure "Two kittens lying side by side, an instinctive behavior that offers both comfort and protection" [ref=e1359]:
                - link [ref=e1360] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Kittens_resting_close_together_for_warmth_and_security.jpg
                  - img "Two kittens resting side by side, an instinctive behavior that offers both protection and comfort" [ref=e1361]
              - paragraph [ref=e1363]:
                - text: Life in proximity to humans and other domestic animals has led to a symbiotic social adaptation in cats, and cats may express great affection toward humans or other animals.
                - link "Ethologically" [ref=e1364] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ethology
                - text: ", a cat's human keeper functions as a mother surrogate."
                - superscript [ref=e1365]:
                  - link "[108]" [ref=e1366] [cursor=pointer]:
                    - /url: "#cite_note-109"
                - text: Adult cats live in a type of extended kittenhood, a form of behavioral
                - link "neoteny" [ref=e1367] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Neoteny
                - text: . Their high-pitched sounds may mimic the cries of a hungry human infant, making them particularly difficult for humans to ignore.
                - superscript [ref=e1368]:
                  - link "[109]" [ref=e1369] [cursor=pointer]:
                    - /url: "#cite_note-McComb_2009-110"
                - text: Some pet cats are poorly socialized. In particular, older cats may show aggressiveness toward newly arrived kittens, which includes biting and scratching; this type of behavior is known as feline asocial aggression.
                - superscript [ref=e1370]:
                  - link "[110]" [ref=e1371] [cursor=pointer]:
                    - /url: "#cite_note-Levine_2005-111"
              - paragraph [ref=e1372]:
                - link "Redirected aggression" [ref=e1373] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Redirected_aggression
                - text: is a common form of aggression that can occur in multiple cat households. In redirected aggression, a cat is usually agitated by a stimulus such as a sight, sound, or other trigger that causes heightened anxiety or arousal; if the cat cannot attack the original stimulus, it may redirect its aggression toward the nearest cat, pet, human, or other being.
                - superscript [ref=e1374]:
                  - link "[111]" [ref=e1375] [cursor=pointer]:
                    - /url: "#cite_note-Horwitz-112"
                - superscript [ref=e1376]:
                  - link "[112]" [ref=e1377] [cursor=pointer]:
                    - /url: "#cite_note-Behaviorist-113"
              - paragraph [ref=e1378]:
                - text: Domestic cats'
                - link "scent rubbing" [ref=e1379] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Scent_rubbing
                - text: behavior toward humans or other cats is thought to be a feline means of social bonding.
                - superscript [ref=e1380]:
                  - link "[113]" [ref=e1381] [cursor=pointer]:
                    - /url: "#cite_note-114"
            - region [ref=e1382]:
              - heading "Communication" [level=3] [ref=e1384]
              - note [ref=e1385]:
                - text: "Main article:"
                - link "Cat communication" [ref=e1386] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_communication
              - table [ref=e1387]:
                - rowgroup [ref=e1388]:
                  - row [ref=e1389]:
                    - cell "Vocalizing domestic cat" [ref=e1390]:
                      - figure [ref=e1391]:
                        - link [ref=e1392] [cursor=pointer]:
                          - /url: https://en.wikipedia.org/wiki/File:Domestic_Cat_Face_Shot.jpg
                  - row [ref=e1395]:
                    - 'cell "A meow Duration: 2 seconds." [ref=e1396]':
                      - separator [ref=e1397]
                      - generic [ref=e1401]:
                        - link "A meow" [ref=e1403] [cursor=pointer]:
                          - /url: https://en.wikipedia.org/wiki/File:Meow_domestic_cat.ogg
                        - generic [ref=e1407]:
                          - button "Play audio" [ref=e1408] [cursor=pointer]
                          - generic [ref=e1410] [cursor=pointer]:
                            - generic [ref=e1411]: "Duration: 2 seconds."
                            - text: 0:02
              - paragraph [ref=e1413]:
                - text: Domestic cats use many
                - link "vocalizations" [ref=e1414] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Animal_communication
                - text: for communication, including
                - link "purring" [ref=e1415] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Purr
                - text: ","
                - link "trilling" [ref=e1416] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Trill_consonant
                - text: ", hissing, growling/snarling, grunting, and several different forms of meowing."
                - superscript [ref=e1417]:
                  - link "[114]" [ref=e1418] [cursor=pointer]:
                    - /url: "#cite_note-Moelk1944-115"
                - text: Their
                - link "body language" [ref=e1419] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_body_language
                - text: ", including position of ears and tail, relaxation of the whole body, and kneading of the paws, are all indicators of mood. The tail and ears are particularly important social signal mechanisms; a raised tail indicates a friendly greeting, and flattened ears indicate hostility. Tail-raising also indicates the cat's position in the group's"
                - link "social hierarchy" [ref=e1420] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Social_hierarchy
                - text: ", with dominant individuals raising their tails less often than subordinate ones."
                - superscript [ref=e1421]:
                  - link "[115]" [ref=e1422] [cursor=pointer]:
                    - /url: "#cite_note-116"
                - text: Feral cats are generally silent.
                - superscript [ref=e1423]:
                  - link "[116]" [ref=e1424] [cursor=pointer]:
                    - /url: "#cite_note-Jensen-117"
                - superscript [ref=e1425]:
                  - 'generic "Page / location: 208" [ref=e1426]': ": 208"
                - text: Nose-to-nose touching is also a common greeting and may be followed by
                - link "social grooming" [ref=e1427] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Social_grooming
                - text: ", which is solicited by one of the cats raising and tilting its head."
                - superscript [ref=e1428]:
                  - link "[104]" [ref=e1429] [cursor=pointer]:
                    - /url: "#cite_note-Crowell-davis2004-105"
              - paragraph [ref=e1430]:
                - link "Purring" [ref=e1431] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Purring
                - text: may have developed as an evolutionary advantage as a signaling mechanism of reassurance between mother cats and
                - link "nursing" [ref=e1432] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Breastfeeding
                - text: kittens, who are thought to use it as a care-soliciting signal.
                - superscript [ref=e1433]:
                  - link "[117]" [ref=e1434] [cursor=pointer]:
                    - /url: "#cite_note-bradshaw2012-118"
                - text: "Post-nursing cats also often purr as a sign of contentment: when being petted, becoming relaxed,"
                - superscript [ref=e1435]:
                  - link "[118]" [ref=e1436] [cursor=pointer]:
                    - /url: "#cite_note-BruelKjaer-119"
                - superscript [ref=e1437]:
                  - link "[119]" [ref=e1438] [cursor=pointer]:
                    - /url: "#cite_note-IsnareCom-120"
                - text: or eating. Although purring is popularly interpreted as indicative of pleasure, it has been recorded in a wide variety of circumstances, most of which involve physical contact between the cat and another, presumably trusted individual.
                - superscript [ref=e1439]:
                  - link "[117]" [ref=e1440] [cursor=pointer]:
                    - /url: "#cite_note-bradshaw2012-118"
                - text: Some cats have been observed to purr continuously when chronically ill or in apparent pain.
                - superscript [ref=e1441]:
                  - link "[120]" [ref=e1442] [cursor=pointer]:
                    - /url: "#cite_note-121"
              - paragraph [ref=e1443]:
                - text: The exact mechanism by which cats purr has long been elusive, but it has been proposed that purring is generated via a series of sudden build-ups and releases of pressure as the
                - link "glottis" [ref=e1444] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Glottis
                - text: is opened and closed, which causes the
                - link "vocal folds" [ref=e1445] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vocal_folds
                - text: to separate forcefully. The
                - link "laryngeal muscles" [ref=e1446] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Larynx
                - text: in control of the glottis are thought to be driven by a
                - link "neural oscillator" [ref=e1447] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Neural_oscillation
                - text: which generates a cycle of contraction and release every 30–40
                - link "milliseconds" [ref=e1448] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Millisecond
                - text: (giving a frequency of 33 to 25 Hz).
                - superscript [ref=e1449]:
                  - link "[117]" [ref=e1450] [cursor=pointer]:
                    - /url: "#cite_note-bradshaw2012-118"
                - superscript [ref=e1451]:
                  - link "[121]" [ref=e1452] [cursor=pointer]:
                    - /url: "#cite_note-122"
                - superscript [ref=e1453]:
                  - link "[122]" [ref=e1454] [cursor=pointer]:
                    - /url: "#cite_note-123"
              - paragraph [ref=e1455]:
                - text: Domestic cats observed in rescue facilities have 276 morphologically distinct
                - link "facial expressions" [ref=e1456] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Facial_expression
                - text: based on 26 facial movements; each facial expression corresponds to different social functions that are probably influenced by domestication.
                - superscript [ref=e1457]:
                  - link "[123]" [ref=e1458] [cursor=pointer]:
                    - /url: "#cite_note-124"
                - text: Facial expressions have helped researchers detect pain in cats. The feline
                - link "grimace scale" [ref=e1459] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Grimace_scale
                - text: "'s five criteria—ear position, orbital tightening, muzzle tension, whisker change, and head position—indicated the presence of acute pain in cats."
                - superscript [ref=e1460]:
                  - link "[124]" [ref=e1461] [cursor=pointer]:
                    - /url: "#cite_note-125"
                - superscript [ref=e1462]:
                  - link "[125]" [ref=e1463] [cursor=pointer]:
                    - /url: "#cite_note-126"
            - region [ref=e1464]:
              - heading "Grooming" [level=3] [ref=e1466]
              - figure "Cat tongue" [ref=e1467]:
                - link [ref=e1468] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Cat_tongue_macro.jpg
              - paragraph [ref=e1471]:
                - text: Cats are known for spending considerable amounts of time licking their coats to keep them clean.
                - superscript [ref=e1472]:
                  - link "[126]" [ref=e1473] [cursor=pointer]:
                    - /url: "#cite_note-hairballs-127"
                - superscript [ref=e1474]:
                  - link "[127]" [ref=e1475] [cursor=pointer]:
                    - /url: "#cite_note-128"
                - text: The cat's tongue has backward-facing spines about 0.5 millimeter long, called
                - link "filiform papillae" [ref=e1476] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Filiform_papillae
                - text: ", which contain"
                - link "keratin" [ref=e1477] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Keratin
                - text: making them rigid.
                - superscript [ref=e1478]:
                  - link "[128]" [ref=e1479] [cursor=pointer]:
                    - /url: "#cite_note-Boshel_1982-129"
                - text: The papillae act like a hairbrush, and some cats, particularly
                - link "long-haired cats" [ref=e1480] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Domestic_long-haired_cat
                - text: ", occasionally regurgitate sausage-shaped 2–3 cm (0.8–1.2 in) long"
                - link "hairballs" [ref=e1481] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hairball
                - text: of fur that have collected in their stomachs from grooming. Hairballs can be prevented with remedies that ease elimination of the hair through the
                - link "gut" [ref=e1482] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gut_(anatomy)
                - text: ", and regular grooming of the coat with a comb or stiff brush."
                - superscript [ref=e1483]:
                  - link "[126]" [ref=e1484] [cursor=pointer]:
                    - /url: "#cite_note-hairballs-127"
            - region [ref=e1485]:
              - heading "Cat intelligence" [level=3] [ref=e1487]
              - note [ref=e1488]:
                - text: "Main article:"
                - link "Cat intelligence" [ref=e1489] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_intelligence
              - figure "A cat uses problem-solving skills to open a door." [ref=e1490]:
                - generic [ref=e1492]:
                  - button "Play video" [ref=e1494] [cursor=pointer]
                  - generic [ref=e1496] [cursor=pointer]:
                    - generic [ref=e1497]: "Duration: 23 seconds."
                    - text: 0:23
                - link:
                  - /url: https://en.wikipedia.org/wiki/File:Cat_opening_door.webm
              - paragraph [ref=e1499]:
                - text: Cat intelligence refers to a cat's ability to solve problems, adapt to its environment, learn new behaviors, and communicate its needs. Structurally, a cat's brain shares similarities with the human brain,
                - superscript [ref=e1500]:
                  - link "[129]" [ref=e1501] [cursor=pointer]:
                    - /url: "#cite_note-Gross_20102-130"
                - text: containing around 250 million neurons in the cerebral cortex, which is responsible for complex processing.
                - superscript [ref=e1502]:
                  - link "[130]" [ref=e1503] [cursor=pointer]:
                    - /url: "#cite_note-131"
                - text: Cats display
                - link "neuroplasticity" [ref=e1504] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Neuroplasticity
                - text: allowing their brains to reorganize based on experiences. They have well-developed memory retaining information for a decade or longer. These memories are often intertwined with emotions, allowing cats to recall both positive and negative experiences associated with specific places.
                - superscript [ref=e1505]:
                  - link "[131]" [ref=e1506] [cursor=pointer]:
                    - /url: "#cite_note-132"
                - text: While they excel in
                - link "observational learning" [ref=e1507] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Observational_learning
                - text: and problem-solving, studies conclude that they struggle with understanding cause-and-effect relationships in the same way that humans do.
                - superscript [ref=e1508]:
                  - link "[132]" [ref=e1509] [cursor=pointer]:
                    - /url: "#cite_note-133"
              - paragraph [ref=e1510]:
                - text: Cat
                - link "intelligence" [ref=e1511] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Animal_cognition
                - text: study is mostly from consideration of the domesticated cat. Living in urban environments has exposed it to challenges that require adaptive behaviors, contributing to cognitive development.
                - superscript [ref=e1512]:
                  - link "[133]" [ref=e1513] [cursor=pointer]:
                    - /url: "#cite_note-134"
                - text: Selective breeding and genetic changes have further influenced its intelligence.
                - superscript [ref=e1514]:
                  - link "[37]" [ref=e1515] [cursor=pointer]:
                    - /url: "#cite_note-DriscollMenotti-Raymond2007-38"
                - text: Kittens learn essential survival skills by observing their mothers, while adult cats refine their abilities through
                - link "trial and error" [ref=e1516] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Trial_and_error
                - text: .
                - superscript [ref=e1517]:
                  - link "[134]" [ref=e1518] [cursor=pointer]:
                    - /url: "#cite_note-135"
            - region [ref=e1519]:
              - heading "Play" [level=3] [ref=e1521]
              - note [ref=e1522]:
                - text: "Main article:"
                - link "Cat play and toys" [ref=e1523] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_play_and_toys
              - figure "Kittens aged 14 weeks use fighting as a form of play." [ref=e1524]:
                - button "Play video" [ref=e1528] [cursor=pointer]
                - link:
                  - /url: https://en.wikipedia.org/wiki/File:Play_fight_between_cats.webmhd.webm
              - paragraph [ref=e1531]:
                - text: Domestic cats, especially young kittens, are known for their love of play. This behavior mimics hunting and is important in helping kittens learn to stalk, capture, and kill prey.
                - superscript [ref=e1532]:
                  - link "[135]" [ref=e1533] [cursor=pointer]:
                    - /url: "#cite_note-136"
                - text: Cats also engage in
                - link "play fighting" [ref=e1534] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rough-and-tumble_play
                - text: ", both with each other and with humans. This behavior may be a way for cats to practice the skills needed for real combat, and it might also reduce the fear that they associate with launching attacks on other animals."
                - superscript [ref=e1535]:
                  - link "[136]" [ref=e1536] [cursor=pointer]:
                    - /url: "#cite_note-137"
              - paragraph [ref=e1537]:
                - text: Cats also tend to play with toys more when they are hungry.
                - superscript [ref=e1538]:
                  - link "[137]" [ref=e1539] [cursor=pointer]:
                    - /url: "#cite_note-138"
                - text: Owing to the close similarity between play and hunting, cats prefer to play with objects that resemble prey, such as small furry toys that move rapidly, but rapidly lose interest. They become
                - link "habituated" [ref=e1540] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Habituation
                - text: to a toy they have played with before.
                - superscript [ref=e1541]:
                  - link "[138]" [ref=e1542] [cursor=pointer]:
                    - /url: "#cite_note-139"
                - text: String is often used as a toy, but if it is eaten, it can become caught at the base of the cat's tongue and then move into the
                - link "intestines" [ref=e1543] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Intestine
                - text: ", a medical emergency which can cause serious illness, even death."
                - superscript [ref=e1544]:
                  - link "[139]" [ref=e1545] [cursor=pointer]:
                    - /url: "#cite_note-140"
            - region [ref=e1546]:
              - heading "Hunting and feeding" [level=3] [ref=e1548]
              - note [ref=e1549]:
                - text: "See also:"
                - link "Cat food" [ref=e1550] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_food
              - figure [ref=e1551]:
                - link [ref=e1552] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Kot_z_myszą.jpg
                - generic [ref=e1554]:
                  - text: A
                  - link "deermouse" [ref=e1555] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Deermouse
                  - text: is the prey of this domestic cat.
              - figure [ref=e1556]:
                - generic [ref=e1558]:
                  - button "Play video" [ref=e1560] [cursor=pointer]
                  - generic [ref=e1562] [cursor=pointer]:
                    - generic [ref=e1563]: "Duration: 1 minute and 2 seconds."
                    - text: 1:02
                - link:
                  - /url: https://en.wikipedia.org/wiki/File:Katt_äter_Påfågelöga_2011.webm
                - generic [ref=e1564]:
                  - text: A domestic cat caught a
                  - link "peacock butterfly" [ref=e1565] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Aglais_io
                  - text: .
              - paragraph [ref=e1566]:
                - text: The shape and structure of cats' cheeks is insufficient to allow them to take in liquids using suction. Lapping at a rate of four times a second, the cat touches the smooth tip of its tongue to the surface of the water, and quickly retracts it like a corkscrew, drawing water upward into their mouths.
                - superscript [ref=e1567]:
                  - link "[140]" [ref=e1568] [cursor=pointer]:
                    - /url: "#cite_note-Reis_2010-141"
                - superscript [ref=e1569]:
                  - link "[141]" [ref=e1570] [cursor=pointer]:
                    - /url: "#cite_note-Kim_2012-142"
              - paragraph [ref=e1571]:
                - text: Feral cats and free-fed house cats consume several small meals in a day. The frequency and size of meals varies between individuals. They select food based on its temperature, smell, and texture; they dislike chilled foods and respond most strongly to moist foods rich in amino acids, which are similar to meat. Cats reject novel flavors (a response termed
                - link "neophobia" [ref=e1572] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Neophobia
                - text: ) and learn quickly to
                - link "avoid foods that have tasted unpleasant" [ref=e1573] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Conditioned_taste_aversion
                - text: in the past.
                - superscript [ref=e1574]:
                  - link "[107]" [ref=e1575] [cursor=pointer]:
                    - /url: "#cite_note-Bradshaw-108"
                - superscript [ref=e1576]:
                  - link "[142]" [ref=e1577] [cursor=pointer]:
                    - /url: "#cite_note-Zaghini-143"
                - text: It is also a common misconception that all cats like milk or cream, as they tend to avoid sweet food and milk. Most adult cats are
                - link "lactose intolerant" [ref=e1578] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lactose_intolerant
                - text: ; the sugar in milk is not easily digested and may cause soft stools or
                - link "diarrhea" [ref=e1579] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Diarrhea
                - text: .
                - superscript [ref=e1580]:
                  - link "[143]" [ref=e1581] [cursor=pointer]:
                    - /url: "#cite_note-Kienzle_1994-144"
                - text: Some also develop odd eating habits and like to eat or chew on things such as wool, plastic, cables, paper, string, aluminum foil, or even coal. This condition,
                - link "pica" [ref=e1582] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pica_(disorder)
                - text: ", can threaten their health, depending on the amount and toxicity of the items eaten."
                - superscript [ref=e1583]:
                  - link "[144]" [ref=e1584] [cursor=pointer]:
                    - /url: "#cite_note-Bradshaw_1997-145"
              - paragraph [ref=e1585]:
                - text: Cats hunt small prey, primarily birds and rodents,
                - superscript [ref=e1586]:
                  - link "[145]" [ref=e1587] [cursor=pointer]:
                    - /url: "#cite_note-Woods-146"
                - text: and are often used as a form of pest control.
                - superscript [ref=e1588]:
                  - link "[146]" [ref=e1589] [cursor=pointer]:
                    - /url: "#cite_note-147"
                - superscript [ref=e1590]:
                  - link "[147]" [ref=e1591] [cursor=pointer]:
                    - /url: "#cite_note-148"
                - text: Other common small creatures, such as lizards, snakes and insects, may also become prey.
                - superscript [ref=e1592]:
                  - link "[148]" [ref=e1593] [cursor=pointer]:
                    - /url: "#cite_note-149"
                - superscript [ref=e1594]:
                  - link "[149]" [ref=e1595] [cursor=pointer]:
                    - /url: "#cite_note-150"
                - text: Cats use two hunting strategies, either stalking prey actively, or
                - link "waiting in ambush" [ref=e1596] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ambush_predator
                - text: until a prey animal comes close enough to be captured.
                - superscript [ref=e1597]:
                  - link "[150]" [ref=e1598] [cursor=pointer]:
                    - /url: "#cite_note-How_Cats_Evolved_to_Win_the_Internet-151"
                - text: The strategy used depends on available prey, with cats waiting in ambush outside burrows, but tending to actively stalk birds.
                - superscript [ref=e1599]:
                  - link "[151]" [ref=e1600] [cursor=pointer]:
                    - /url: "#cite_note-Turner_2000-152"
                - superscript [ref=e1601]:
                  - 'generic "Page / location: 153" [ref=e1602]': ": 153"
                - text: Domestic cats are a major
                - link "predators of wildlife" [ref=e1603] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_predation_on_wildlife
                - text: in the United States, killing an estimated 1.3 to 4.0 billion birds and 6.3 to 22.3 billion mammals annually.
                - superscript [ref=e1604]:
                  - link "[152]" [ref=e1605] [cursor=pointer]:
                    - /url: "#cite_note-NC012913-153"
              - paragraph [ref=e1606]:
                - text: Certain species appear more susceptible than others; in one English village, for example, 30% of house sparrow mortality was linked to the domestic cat.
                - superscript [ref=e1607]:
                  - link "[153]" [ref=e1608] [cursor=pointer]:
                    - /url: "#cite_note-Chucher_1987-154"
                - text: In the recovery of ringed robins (
                - link "Erithacus rubecula" [ref=e1610] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Erithacus_rubecula
                - text: ) and dunnocks (
                - link "Prunella modularis" [ref=e1612] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Prunella_modularis
                - text: ) in Britain, 31% of deaths were a result of cat predation.
                - superscript [ref=e1613]:
                  - link "[154]" [ref=e1614] [cursor=pointer]:
                    - /url: "#cite_note-Mead_1982_183–186-155"
                - text: In parts of North America, the presence of larger carnivores such as
                - link "coyotes" [ref=e1615] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coyote
                - text: ", which prey on cats and other small predators, reduces the effect of predation by cats and other small predators such as"
                - link "opossums" [ref=e1616] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Opossum
                - text: and
                - link "raccoons" [ref=e1617] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Raccoon
                - text: on bird numbers and variety.
                - superscript [ref=e1618]:
                  - link "[155]" [ref=e1619] [cursor=pointer]:
                    - /url: "#cite_note-Crooks_1999-156"
              - paragraph [ref=e1620]:
                - text: Another poorly understood element of cat hunting behavior is the presentation of prey to human guardians. One explanation is that cats adopt humans into their social group and share excess kill with others in the group according to the
                - link "dominance hierarchy" [ref=e1621] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dominance_hierarchy
                - text: ", in which humans are reacted to as if they are at or near the top."
                - superscript [ref=e1622]:
                  - link "[156]" [ref=e1623] [cursor=pointer]:
                    - /url: "#cite_note-Leyhausen_1978-157"
                - text: Another explanation is that they attempt to teach their guardians to hunt or to help their human as if feeding "an elderly cat, or an inept kitten".
                - superscript [ref=e1624]:
                  - link "[157]" [ref=e1625] [cursor=pointer]:
                    - /url: "#cite_note-Morris_Catwatching_1-158"
                - text: This hypothesis is inconsistent with the fact that male cats also bring home prey, though males have negligible involvement in raising kittens.
                - superscript [ref=e1626]:
                  - link "[151]" [ref=e1627] [cursor=pointer]:
                    - /url: "#cite_note-Turner_2000-152"
                - superscript [ref=e1628]:
                  - 'generic "Page / location: 153" [ref=e1629]': ": 153"
            - region [ref=e1630]:
              - heading "Fighting" [level=3] [ref=e1632]
              - figure [ref=e1633]:
                - link [ref=e1634] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:GAto.jpg
                - generic [ref=e1636]:
                  - text: A domestic cat exhibiting a
                  - link "threat display" [ref=e1637] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Deimatic_behaviour
                  - text: ", hissing and arching its back."
              - paragraph [ref=e1638]:
                - text: Domestic males are more likely to fight than females.
                - superscript [ref=e1639]:
                  - link "[158]" [ref=e1640] [cursor=pointer]:
                    - /url: "#cite_note-Lindell-159"
                - text: The most common reason for feral
                - link "cat fighting" [ref=e1641] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Catfight_(animal_behavior)
                - text: is competition between two males to mate with a female, and most fights are won by the heavier male.
                - superscript [ref=e1642]:
                  - link "[159]" [ref=e1643] [cursor=pointer]:
                    - /url: "#cite_note-courtship-160"
                - text: Another common reason for fighting in domestic cats is the difficulty of establishing territories within a small home.
                - superscript [ref=e1644]:
                  - link "[158]" [ref=e1645] [cursor=pointer]:
                    - /url: "#cite_note-Lindell-159"
                - text: Female cats also fight over territory or to defend their kittens.
                - link "Neutering" [ref=e1646] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Neutering
                - text: decreases or eliminates this behavior in many cases, suggesting that the behavior is linked to
                - link "sex hormones" [ref=e1647] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sex_hormone
                - text: .
                - superscript [ref=e1648]:
                  - link "[160]" [ref=e1649] [cursor=pointer]:
                    - /url: "#cite_note-161"
              - paragraph [ref=e1650]:
                - text: When cats become aggressive, they try to appear larger and more threatening by raising their fur, arching their backs, turning sideways, hissing, or spitting.
                - superscript [ref=e1651]:
                  - link "[161]" [ref=e1652] [cursor=pointer]:
                    - /url: "#cite_note-behaviourguide-162"
                - text: Often, the ears are pointed down and back to avoid damage to the inner ear and potentially listen for any changes behind them while focused forward. Cats may also vocalize loudly and bare their teeth in an effort to further intimidate their opponents. Fights usually consist of grappling, slapping the face and body with the forepaws, and bites. Cats throw themselves to the ground in a defensive posture to rake their opponent's belly with their hind legs.
                - superscript [ref=e1653]:
                  - link "[162]" [ref=e1654] [cursor=pointer]:
                    - /url: "#cite_note-163"
              - paragraph [ref=e1655]:
                - text: Serious damage is rare, because the fights are usually short, with the loser fleeing with scratches to the face and ears. More severe fights for mating rights may give deep punctures and lacerations. Normally, serious injuries from fighting are limited to infections from scratches and bites. Bites are probably the main route of transmission of the
                - link "feline immunodeficiency virus" [ref=e1656] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Feline_immunodeficiency_virus
                - text: .
                - superscript [ref=e1657]:
                  - link "[163]" [ref=e1658] [cursor=pointer]:
                    - /url: "#cite_note-Pederson_1989-164"
                - text: Sexually active males are usually involved in many fights and have battered faces.
                - superscript [ref=e1659]:
                  - link "[164]" [ref=e1660] [cursor=pointer]:
                    - /url: "#cite_note-165"
                - text: Cats often threaten animals larger than them to defend their territory, such as dogs and
                - link "foxes" [ref=e1661] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Red_fox
                - text: .
                - superscript [ref=e1662]:
                  - link "[165]" [ref=e1663] [cursor=pointer]:
                    - /url: "#cite_note-166"
            - region [ref=e1664]:
              - heading "Reproduction" [level=3] [ref=e1666]
              - figure [ref=e1667]:
                - link [ref=e1668] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Mating_Cats_(Domestic_cats)_in_Kannur.jpg
                - generic [ref=e1670]:
                  - text: When cats mate, the tomcat (male) bites the scruff of the female's neck as she assumes a position conducive to
                  - link "mating" [ref=e1671] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Mating
                  - text: known as
                  - link "lordosis behavior" [ref=e1672] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Lordosis_behavior
                  - text: .
              - paragraph [ref=e1673]:
                - text: The cat secretes and perceives
                - link "pheromones" [ref=e1674] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pheromone
                - text: .
                - superscript [ref=e1675]:
                  - link "[166]" [ref=e1676] [cursor=pointer]:
                    - /url: "#cite_note-Bland1979-167"
                - text: Female cats, called queens, are
                - link "polyestrous" [ref=e1677] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Polyestrous
                - text: with several
                - link "estrus" [ref=e1678] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Estrus
                - text: cycles during a year, lasting usually 21 days. They are usually ready to mate between early February and August
                - superscript [ref=e1679]:
                  - link "[167]" [ref=e1680] [cursor=pointer]:
                    - /url: "#cite_note-Jemmett1977-168"
                - text: in northern temperate zones and throughout the year in equatorial regions.
                - superscript [ref=e1681]:
                  - link "[168]" [ref=e1682] [cursor=pointer]:
                    - /url: "#cite_note-estrous_cycle-169"
              - paragraph [ref=e1683]:
                - text: Several males, called tomcats, are attracted to a female in heat. They fight over her, and the victor wins the right to mate. At first, the female rejects the male, but eventually, the female allows the male to mate. The female utters a loud yowl as the male pulls out of her because a male cat's
                - link "penis" [ref=e1684] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Penis
                - text: has a band of about 120–150 backward-pointing
                - link "penile spines" [ref=e1685] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Penile_spines
                - text: ", which are about 1 mm (0.04 in) long; upon withdrawal of the penis, the spines may provide the female with increased sexual stimulation, which acts to"
                - link "induce ovulation" [ref=e1686] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Induced_ovulation_(animals)
                - text: .
                - superscript [ref=e1687]:
                  - link "[169]" [ref=e1688] [cursor=pointer]:
                    - /url: "#cite_note-Aronson_1967-170"
              - figure "In this radiography of a pregnant cat, the skeletons of two fetuses are on the left and right of the uterus." [ref=e1689]:
                - link [ref=e1690] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Radiography_of_a_pregnant_cat.jpg
              - paragraph [ref=e1693]:
                - text: After mating, the female cleans her
                - link "vulva" [ref=e1694] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vulva
                - text: thoroughly. If a male attempts to mate with her at this point, the female attacks him. After about 20 to 30 minutes, once the female is finished grooming, the cycle will repeat.
                - superscript [ref=e1695]:
                  - link "[170]" [ref=e1696] [cursor=pointer]:
                    - /url: "#cite_note-compendium-171"
                - text: Because ovulation is not always triggered by a single mating, females may not be impregnated by the first male with which they mate.
                - superscript [ref=e1697]:
                  - link "[171]" [ref=e1698] [cursor=pointer]:
                    - /url: "#cite_note-Wildt_1980-172"
                - text: Furthermore, cats are
                - link "superfecund" [ref=e1699] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Superfecundation
                - text: ; that is, a female may mate with more than one male when she is in heat, with the result that different kittens in a litter may have different fathers.
                - superscript [ref=e1700]:
                  - link "[170]" [ref=e1701] [cursor=pointer]:
                    - /url: "#cite_note-compendium-171"
              - paragraph [ref=e1702]:
                - text: The
                - link "morula" [ref=e1703] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Morula
                - text: forms 124 hours after conception. At 148 hours, early
                - link "blastocysts" [ref=e1704] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Blastocyst
                - text: form. At 10–12 days, implantation occurs.
                - superscript [ref=e1705]:
                  - link "[172]" [ref=e1706] [cursor=pointer]:
                    - /url: "#cite_note-173"
                - text: The
                - link "gestation" [ref=e1707] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gestation
                - text: of queens lasts between 64 and 67 days, with an average of 65 days.
                - superscript [ref=e1708]:
                  - link "[167]" [ref=e1709] [cursor=pointer]:
                    - /url: "#cite_note-Jemmett1977-168"
                - superscript [ref=e1710]:
                  - link "[173]" [ref=e1711] [cursor=pointer]:
                    - /url: "#cite_note-Tsutsui_1993-174"
              - figure "Two 17-day-old kittens" [ref=e1712]:
                - link [ref=e1713] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:പൂച്ചക്കുഞ്ഞുങ്ങൾ_(17_ദിവസം_പ്രായം).JPG
              - paragraph [ref=e1716]:
                - text: Based on a study of 2,300 free-ranging queens conducted from May 1998 and October2000, they had one to six kittens per
                - link "litter" [ref=e1718] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Litter_(animal)
                - text: ", with an average of three kittens. They produced a mean of 1.4 litters per year, but a maximum of three litters in a year. Of 169 kittens, 127 died before they were six months old due to a trauma caused in most cases by dog attacks and road accidents."
                - superscript [ref=e1719]:
                  - link "[174]" [ref=e1720] [cursor=pointer]:
                    - /url: "#cite_note-Nutter2004-175"
                - text: The first litter is usually smaller than subsequent litters. Kittens are weaned between six and seven weeks of age. Queens normally reach sexual maturity at 5–10 months, and males at 5–7 months. This varies depending on breed.
                - superscript [ref=e1721]:
                  - link "[170]" [ref=e1722] [cursor=pointer]:
                    - /url: "#cite_note-compendium-171"
                - text: Kittens reach
                - link "puberty" [ref=e1723] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Puberty
                - text: at the age of 9–10 months.
                - superscript [ref=e1724]:
                  - link "[167]" [ref=e1725] [cursor=pointer]:
                    - /url: "#cite_note-Jemmett1977-168"
              - paragraph [ref=e1726]:
                - text: Cats are ready to go to new homes at about 12 weeks of age, when they are ready to leave their mother.
                - superscript [ref=e1727]:
                  - link "[175]" [ref=e1728] [cursor=pointer]:
                    - /url: "#cite_note-176"
                - text: They can be surgically
                - link "sterilized" [ref=e1729] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Neutering
                - text: (spayed or
                - link "castrated" [ref=e1730] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Castration
                - text: ) as early as seven weeks to limit unwanted reproduction.
                - superscript [ref=e1731]:
                  - link "[176]" [ref=e1732] [cursor=pointer]:
                    - /url: "#cite_note-177"
                - text: This surgery also prevents undesirable sex-related behavior, such as aggression,
                - link "territory marking" [ref=e1733] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Spraying_(animal_behavior)
                - text: (spraying urine) in males, and yowling (calling) in females. Traditionally, this surgery was performed at around six to nine months of age, but it is increasingly being performed before
                - link "puberty" [ref=e1734] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Puberty
                - text: ", at about three to six months."
                - superscript [ref=e1735]:
                  - link "[177]" [ref=e1736] [cursor=pointer]:
                    - /url: "#cite_note-178"
                - text: In the United States, about 80% of household cats are neutered.
                - superscript [ref=e1737]:
                  - link "[178]" [ref=e1738] [cursor=pointer]:
                    - /url: "#cite_note-179"
          - region [ref=e1739]:
            - heading "Lifespan and health" [level=2] [ref=e1741]
            - note [ref=e1742]:
              - text: "Main articles:"
              - link "Cat health" [ref=e1743] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cat_health
              - text: and
              - link "Aging in cats" [ref=e1744] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Aging_in_cats
            - paragraph [ref=e1745]:
              - text: The average lifespan of pet cats has risen in recent decades. In the early 1980s, it was about 7 years,
              - superscript [ref=e1746]:
                - link "[179]" [ref=e1747] [cursor=pointer]:
                  - /url: "#cite_note-Kraft1998-180"
              - superscript [ref=e1748]:
                - 'generic "Page / location: 33" [ref=e1749]': ": 33"
              - superscript [ref=e1750]:
                - link "[180]" [ref=e1751] [cursor=pointer]:
                  - /url: "#cite_note-Nassar_1984-181"
              - text: rising to 9.4 years in 1995
              - superscript [ref=e1752]:
                - link "[179]" [ref=e1753] [cursor=pointer]:
                  - /url: "#cite_note-Kraft1998-180"
              - superscript [ref=e1754]:
                - 'generic "Page / location: 33" [ref=e1755]': ": 33"
              - text: and an average of about 13 years as of 2014 and 2023.
              - superscript [ref=e1756]:
                - link "[181]" [ref=e1757] [cursor=pointer]:
                  - /url: "#cite_note-182"
              - superscript [ref=e1758]:
                - link "[182]" [ref=e1759] [cursor=pointer]:
                  - /url: "#cite_note-183"
            - paragraph [ref=e1760]:
              - text: Neutering increases life expectancy; one 2024 study found neutered cats to live one year longer than entire cats.
              - superscript [ref=e1761]:
                - link "[183]" [ref=e1762] [cursor=pointer]:
                  - /url: "#cite_note-184"
              - text: Having a cat
              - link "neutered" [ref=e1763] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Neutering
              - text: confers some health benefits, such as a decreased incidence of reproductive
              - link "neoplasia" [ref=e1764] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Neoplasia
              - text: .
              - superscript [ref=e1765]:
                - link "[184]" [ref=e1766] [cursor=pointer]:
                  - /url: "#cite_note-Obesity1-185"
              - text: However, neutering decreases metabolism
              - superscript [ref=e1767]:
                - link "[185]" [ref=e1768] [cursor=pointer]:
                  - /url: "#cite_note-186"
              - superscript [ref=e1769]:
                - link "[186]" [ref=e1770] [cursor=pointer]:
                  - /url: "#cite_note-Obesity2-187"
              - superscript [ref=e1771]:
                - link "[187]" [ref=e1772] [cursor=pointer]:
                  - /url: "#cite_note-Obesity3-188"
              - text: and increases food intake,
              - superscript [ref=e1773]:
                - link "[187]" [ref=e1774] [cursor=pointer]:
                  - /url: "#cite_note-Obesity3-188"
              - superscript [ref=e1775]:
                - link "[188]" [ref=e1776] [cursor=pointer]:
                  - /url: "#cite_note-Obesity4-189"
              - text: both of which can cause obesity in neutered cats.
              - superscript [ref=e1777]:
                - link "[189]" [ref=e1778] [cursor=pointer]:
                  - /url: "#cite_note-Obesity5-190"
              - text: Pre-pubertal neutering (neutering at 4 months or earlier) was only recommended by 28% of American veterinarians in one study. Some concerns of early neutering were metabolic, retarded
              - link "physeal closure" [ref=e1779] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Epiphyseal_plate
              - text: ", and urinary tract disease related."
              - superscript [ref=e1780]:
                - link "[190]" [ref=e1781] [cursor=pointer]:
                  - /url: "#cite_note-191"
            - region [ref=e1782]:
              - heading "Disease" [level=3] [ref=e1784]
              - note [ref=e1785]:
                - text: "Main article:"
                - link "List of feline diseases" [ref=e1786] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/List_of_feline_diseases
              - paragraph [ref=e1787]:
                - text: About 250 heritable
                - link "genetic disorders" [ref=e1788] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Genetic_disorder
                - text: have been identified in cats; many are similar to human
                - link "inborn errors of metabolism" [ref=e1789] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Inborn_errors_of_metabolism
                - text: .
                - superscript [ref=e1790]:
                  - link "[191]" [ref=e1791] [cursor=pointer]:
                    - /url: "#cite_note-192"
                - text: The high level of similarity among the
                - link "metabolism" [ref=e1792] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Metabolism
                - text: of mammals allows many of these feline diseases to be diagnosed using
                - link "genetic tests" [ref=e1793] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Genetic_testing
                - text: that were originally developed for use in humans, as well as the use of cats as
                - link "animal models" [ref=e1794] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Animal_model
                - text: in the study of the human diseases.
                - superscript [ref=e1795]:
                  - link "[192]" [ref=e1796] [cursor=pointer]:
                    - /url: "#cite_note-193"
                - superscript [ref=e1797]:
                  - link "[193]" [ref=e1798] [cursor=pointer]:
                    - /url: "#cite_note-194"
                - text: Diseases affecting domestic cats include acute infections,
                - link "parasitic infestations" [ref=e1799] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Parasitic_disease
                - text: ", injuries, and chronic diseases such as"
                - link "kidney disease" [ref=e1800] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chronic_kidney_disease_in_cats
                - text: ","
                - link "hyperthyroidism" [ref=e1801] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Feline_hyperthyroidism
                - text: ", and"
                - link "arthritis" [ref=e1802] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Arthritis
                - text: .
                - link "Vaccinations" [ref=e1803] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Feline_vaccination
                - text: are available for many infectious diseases, as are treatments to eliminate parasites such as worms, ticks, and fleas.
                - superscript [ref=e1804]:
                  - link "[194]" [ref=e1805] [cursor=pointer]:
                    - /url: "#cite_note-195"
          - region [ref=e1806]:
            - heading "Health issues" [level=2] [ref=e1808]
            - paragraph [ref=e1809]:
              - text: Between 50% and 90% of cats experience
              - link "dental" [ref=e1810] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tooth_pathology
              - text: or
              - link "gum" [ref=e1811] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Gums
              - text: problems, but these can be prevented by maintaining the cat's
              - link "oral hygiene" [ref=e1812] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Oral_hygiene
              - text: using products specifically designed for cats, which are not toxic for them.
              - superscript [ref=e1813]:
                - link "[195]" [ref=e1814] [cursor=pointer]:
                  - /url: "#cite_note-CollegeDental-196"
              - text: Accidental
              - link "poisoning" [ref=e1815] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Poisoning
              - text: "in cats is common and can result from several sources: plants that are toxic to cats,"
              - link "medications" [ref=e1816] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Medications
              - text: not intended for cats, foods unsuitable for cats, and household substances such as pesticides and household cleaners.
              - superscript [ref=e1817]:
                - link "[196]" [ref=e1818] [cursor=pointer]:
                  - /url: "#cite_note-CollegeHazards-197"
              - text: Plants toxic to cats include
              - link "lilies" [ref=e1819] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Lilium
              - text: ","
              - link "tulips" [ref=e1820] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tulip
              - text: ", and"
              - link "philodendrons" [ref=e1821] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Philodendron
              - text: ; medication poisoning occurs when cats ingest drugs intended for human, such as
              - link "acetaminophen" [ref=e1822] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Acetaminophen
              - text: and
              - link "aspirin" [ref=e1823] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Aspirin
              - text: ", as well as vitamin capsules, flea treatments designed for dogs, and foods dangerous to cats like"
              - link "grapes" [ref=e1824] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Grapes
              - text: ","
              - link "onions" [ref=e1825] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Onions
              - text: ","
              - link "garlic" [ref=e1826] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Garlic
              - text: ", and"
              - link "chocolate" [ref=e1827] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Chocolate
              - text: .
              - superscript [ref=e1828]:
                - link "[196]" [ref=e1829] [cursor=pointer]:
                  - /url: "#cite_note-CollegeHazards-197"
            - paragraph [ref=e1830]:
              - text: Cat owners' attitudes and knowledge affects how they care for their cats, and people with greater knowledge about cats are less likely to use
              - link "positive punishment" [ref=e1831] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Positive_punishment
              - text: ", i.e. causing an unpleasant"
              - link "stimulus" [ref=e1832] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Stimulus_(psychology)
              - text: to the cat.
              - superscript [ref=e1833]:
                - link "[197]" [ref=e1834] [cursor=pointer]:
                  - /url: "#cite_note-Grigg2019-198"
              - text: Several organizations have published guidelines for the proper and safe care of cats. The
              - link "American Society for the Prevention of Cruelty to Animals" [ref=e1835] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/American_Society_for_the_Prevention_of_Cruelty_to_Animals
              - text: has published a general guide emphasizing proper cat care, which covers appropriate
              - link "nutrition" [ref=e1836] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nutrition
              - text: and needs for fresh and clean water,
              - link "coat" [ref=e1837] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Animal_coat
              - text: care, litter box maintenance, regular veterinary care.
              - superscript [ref=e1838]:
                - link "[198]" [ref=e1839] [cursor=pointer]:
                  - /url: "#cite_note-ASPCAgeneral-199"
              - text: The American Association of Feline Practitioners and the International Society of Feline Medicine released a guide on environmental needs of cats.
              - superscript [ref=e1840]:
                - link "[199]" [ref=e1841] [cursor=pointer]:
                  - /url: "#cite_note-Ellis2013-200"
              - text: Professional organizations have emphasized the importance of
              - link "environmental enrichment" [ref=e1842] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Environmental_enrichment
              - text: for cats,
              - superscript [ref=e1843]:
                - link "[199]" [ref=e1844] [cursor=pointer]:
                  - /url: "#cite_note-Ellis2013-200"
              - text: and some authors have raised concerns that many cat owners do not provide sufficient environmental enrichment. In an online survey of cat owners, only about half of the respondents reported playing with their cats daily.
              - superscript [ref=e1845]:
                - link "[197]" [ref=e1846] [cursor=pointer]:
                  - /url: "#cite_note-Grigg2019-198"
            - paragraph [ref=e1847]:
              - text: Guidelines have also been published for
              - link "veterinarians" [ref=e1848] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Veterinarians
              - text: and caregivers to improve the
              - link "welfare" [ref=e1849] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Animal_welfare
              - text: of cats under their care, including recommendations for cat-friendly interactions in veterinary clinics.
              - superscript [ref=e1850]:
                - link "[200]" [ref=e1851] [cursor=pointer]:
                  - /url: "#cite_note-Rodan2022-201"
              - text: "The guide focuses on five main aspects: providing a safe private space for the cat (e.g., a"
              - link "cardboard" [ref=e1852] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cardboard
              - text: box on its side, placed in a high location, and in sufficient numbers if multiple cats are present); offering multiple environmental resources (several feeding stations, resting areas and litter boxes, and separating food from water); opportunities for play and activities that simulate
              - link "hunting behavior" [ref=e1853] [cursor=pointer]:
                - /url: "#Hunting_and_feeding"
              - text: (using appropriate toys and puzzle feeders); positive, consistent, and predictable social interaction (acclimating the cat to frequent contact from an early age, speaking softly, and avoiding forced contact); and an environment that allows the cat to use its sense of smell normally (providing scratching posts and other items where it can leave its
              - link "scent" [ref=e1854] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Scent
              - text: ", and avoiding strong odors throughout the home)."
              - superscript [ref=e1855]:
                - text: "["
                - link "citation needed" [ref=e1857] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wikipedia:Citation_needed
                - text: "]"
          - region [ref=e1858]:
            - heading "Ecology" [level=2] [ref=e1860]
            - region [ref=e1861]:
              - heading "Habitats" [level=3] [ref=e1863]
              - figure [ref=e1864]:
                - link [ref=e1865] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Siamese_cat_of_Altai_shepherds.jpg
                - generic [ref=e1867]:
                  - text: A
                  - link "colourpoint domestic shorthair cat" [ref=e1868] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Colorpoint_Shorthair
                  - text: living among the
                  - link "yurts" [ref=e1869] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Yurts
                  - text: of shepherds in the
                  - link "Altai Mountains" [ref=e1870] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Altai_Mountains
                  - text: ", Russia"
              - paragraph [ref=e1871]:
                - text: The domestic cat is a
                - link "cosmopolitan species" [ref=e1872] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cosmopolitan_species
                - text: and occurs across much of the world.
                - superscript [ref=e1873]:
                  - link "[51]" [ref=e1874] [cursor=pointer]:
                    - /url: "#cite_note-Lipinski-52"
                - text: It is adaptable and now present on all continents except
                - link "Antarctica" [ref=e1875] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Antarctica
                - text: ", and on 118 of the 131 main groups of islands, even on the remote"
                - link "Kerguelen Islands" [ref=e1876] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kerguelen_Islands
                - text: .
                - superscript [ref=e1877]:
                  - link "[201]" [ref=e1878] [cursor=pointer]:
                    - /url: "#cite_note-202"
                - superscript [ref=e1879]:
                  - link "[202]" [ref=e1880] [cursor=pointer]:
                    - /url: "#cite_note-203"
                - text: Due to its ability to thrive in almost any terrestrial habitat, it is among the world's most
                - link "invasive species" [ref=e1881] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Invasive_species
                - text: .
                - superscript [ref=e1882]:
                  - link "[203]" [ref=e1883] [cursor=pointer]:
                    - /url: "#cite_note-204"
                - text: It lives on small islands with no human inhabitants.
                - superscript [ref=e1884]:
                  - link "[204]" [ref=e1885] [cursor=pointer]:
                    - /url: "#cite_note-205"
                - text: Feral cats can live in forests, grasslands, tundra, coastal areas, agricultural land, scrublands, urban areas, and wetlands.
                - superscript [ref=e1886]:
                  - link "[205]" [ref=e1887] [cursor=pointer]:
                    - /url: "#cite_note-ISSG_2006-206"
              - paragraph [ref=e1888]:
                - text: The unwantedness that leads to the domestic cat being
                - link "treated as an invasive species" [ref=e1889] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_predation_on_wildlife#Impact_by_location
                - text: is twofold. As it is little altered from the wildcat, it can readily interbreed with the wildcat. This
                - link "hybridization" [ref=e1890] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hybrid_(biology)
                - text: poses a danger to the genetic distinctiveness of some wildcat populations, particularly in Scotland and Hungary, possibly also the
                - link "Iberian Peninsula" [ref=e1891] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Iberian_Peninsula
                - text: ", and where protected natural areas are close to human-dominated landscapes, such as"
                - link "Kruger National Park" [ref=e1892] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kruger_National_Park
                - text: in South Africa.
                - superscript [ref=e1893]:
                  - link "[206]" [ref=e1894] [cursor=pointer]:
                    - /url: "#cite_note-Kruger-207"
                - superscript [ref=e1895]:
                  - link "[52]" [ref=e1896] [cursor=pointer]:
                    - /url: "#cite_note-Oliveira-53"
                - text: However, its introduction to places where no native felines are present also contributes to the decline of native species.
                - superscript [ref=e1897]:
                  - link "[207]" [ref=e1898] [cursor=pointer]:
                    - /url: "#cite_note-contr-ext-208"
            - region [ref=e1899]:
              - heading "Ferality" [level=3] [ref=e1901]
              - note [ref=e1902]:
                - text: "Main article:"
                - link "Feral cat" [ref=e1903] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Feral_cat
              - figure [ref=e1904]:
                - link [ref=e1905] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Feral_cat_Virginia_crop.jpg
                - generic [ref=e1907]:
                  - text: Feral
                  - link "farm cat" [ref=e1908] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Farm_cat
              - paragraph [ref=e1909]:
                - text: Feral cats are domestic cats that were born in or have reverted to a wild state. They are unfamiliar with and wary of humans and roam freely in urban and rural areas.
                - superscript [ref=e1910]:
                  - link "[208]" [ref=e1911] [cursor=pointer]:
                    - /url: "#cite_note-Rochlitz-209"
                - text: The numbers of feral cats are not known, but estimates of the United States feral population range from 25 to 60 million.
                - superscript [ref=e1912]:
                  - link "[208]" [ref=e1913] [cursor=pointer]:
                    - /url: "#cite_note-Rochlitz-209"
                - text: Feral cats may live alone, but most are in large
                - link "colonies" [ref=e1914] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Feral_cat_colonies
                - text: ", which occupy a specific territory and are usually associated with a source of food."
                - superscript [ref=e1915]:
                  - link "[209]" [ref=e1916] [cursor=pointer]:
                    - /url: "#cite_note-hsus-feral-210"
                - text: Famous feral cat colonies are in Rome around the
                - link "Colosseum" [ref=e1917] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Colosseum
                - text: and
                - link "Forum Romanum" [ref=e1918] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Forum_Romanum
                - text: ", some being fed and given medical attention by volunteers."
                - superscript [ref=e1919]:
                  - link "[210]" [ref=e1920] [cursor=pointer]:
                    - /url: "#cite_note-211"
              - paragraph [ref=e1921]:
                - text: Public attitudes toward feral cats vary widely, from seeing them as free-ranging pets to regarding them as
                - link "vermin" [ref=e1922] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vermin
                - text: .
                - superscript [ref=e1923]:
                  - link "[211]" [ref=e1924] [cursor=pointer]:
                    - /url: "#cite_note-212"
            - region [ref=e1925]:
              - heading "Impact on wildlife" [level=3] [ref=e1927]
              - note [ref=e1928]:
                - text: "Main article:"
                - link "Cat predation on wildlife" [ref=e1929] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_predation_on_wildlife
              - figure [ref=e1930]:
                - link [ref=e1931] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Feral_Cat_(5573630708).jpg
                - generic [ref=e1933]:
                  - text: Cats kill billions of wild birds each year. This feral cat near
                  - link "Brisbane" [ref=e1934] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Brisbane
                  - text: has caught a
                  - link "Pale-headed rosella" [ref=e1935] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Pale-headed_rosella
                  - text: .
              - paragraph [ref=e1936]:
                - text: Domestic cats are a contributing factor to the decline of several species, a factor that has ultimately led, in some cases, to extinction.
                - link "The South Island piopio" [ref=e1937] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Turnagra_capensis
                - text: ","
                - link "Chatham rail" [ref=e1938] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rallus_modestus
                - text: ","
                - superscript [ref=e1939]:
                  - link "[154]" [ref=e1940] [cursor=pointer]:
                    - /url: "#cite_note-Mead_1982_183–186-155"
                - text: and the
                - link "New Zealand merganser" [ref=e1941] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/New_Zealand_merganser
                - superscript [ref=e1942]:
                  - link "[212]" [ref=e1943] [cursor=pointer]:
                    - /url: "#cite_note-213"
                - text: are a few from a long list, with the most extreme case being the flightless
                - link "Lyall's wren" [ref=e1944] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lyall's_wren
                - text: ", which was driven to extinction only a few years after its discovery."
                - superscript [ref=e1945]:
                  - link "[213]" [ref=e1946] [cursor=pointer]:
                    - /url: "#cite_note-214"
                - superscript [ref=e1947]:
                  - link "[214]" [ref=e1948] [cursor=pointer]:
                    - /url: "#cite_note-215"
                - text: One feral cat in New Zealand killed 102
                - link "New Zealand lesser short-tailed bats" [ref=e1949] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/New_Zealand_lesser_short-tailed_bat
                - text: in seven days.
                - superscript [ref=e1950]:
                  - link "[215]" [ref=e1951] [cursor=pointer]:
                    - /url: "#cite_note-216"
                - text: In the United States, feral and free-ranging domestic cats kill an estimated 6.3–22.3 billion mammals annually.
                - superscript [ref=e1952]:
                  - link "[152]" [ref=e1953] [cursor=pointer]:
                    - /url: "#cite_note-NC012913-153"
              - paragraph [ref=e1954]:
                - text: In Australia, one study found feral cats to kill 466 million reptiles per year. More than 258 reptile species were identified as being predated by cats.
                - superscript [ref=e1955]:
                  - link "[216]" [ref=e1956] [cursor=pointer]:
                    - /url: "#cite_note-217"
                - text: Cats have contributed to the extinction of the
                - link "Navassa curly-tailed lizard" [ref=e1957] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Navassa_curly-tailed_lizard
                - text: and
                - generic [ref=e1958]:
                  - link "Chioninia coctei" [ref=e1959] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Chioninia_coctei
                  - text: .
                - superscript [ref=e1960]:
                  - link "[207]" [ref=e1961] [cursor=pointer]:
                    - /url: "#cite_note-contr-ext-208"
          - region [ref=e1962]:
            - heading "Interaction with humans" [level=2] [ref=e1964]
            - note [ref=e1965]:
              - text: "Main article:"
              - link "Human interaction with cats" [ref=e1966] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Human_interaction_with_cats
            - figure "A cat lying on a man's lap" [ref=e1967]:
              - link [ref=e1968] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Mainecoon-lap.jpg
                - img "A long-haired calico cat sat in the lap of a man who is sat cross-legged on the floor." [ref=e1969]
            - paragraph [ref=e1971]:
              - text: Cats are common
              - link "pets" [ref=e1972] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Pet
              - text: throughout the world, and their worldwide population as of 2007 exceeded 500 million.
              - superscript [ref=e1973]:
                - link "[217]" [ref=e1974] [cursor=pointer]:
                  - /url: "#cite_note-NYT-218"
              - text: As of 2024, the domestic cat was the second most popular pet in the United States, with 73.8 million cats owned and around 42.2 million households owning at least one cat.
              - superscript [ref=e1975]:
                - link "[218]" [ref=e1976] [cursor=pointer]:
                  - /url: "#cite_note-219"
              - superscript [ref=e1977]:
                - link "[219]" [ref=e1978] [cursor=pointer]:
                  - /url: "#cite_note-220"
              - text: In the United Kingdom, 26% of adults have a cat, with an estimated population of 10.9 million pet cats as of 2020.
              - superscript [ref=e1979]:
                - link "[220]" [ref=e1980] [cursor=pointer]:
                  - /url: "#cite_note-221"
              - text: As of 2021, there were an estimated 220 million owned and 480 million stray cats in the world.
              - superscript [ref=e1981]:
                - link "[221]" [ref=e1982] [cursor=pointer]:
                  - /url: "#cite_note-222"
            - paragraph [ref=e1983]:
              - text: Cats have been used for millennia to control rodents, notably
              - link "around grain stores" [ref=e1984] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Farm_cat
              - text: and
              - link "aboard ships" [ref=e1985] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ship's_cat
              - text: ", and both uses extend to the present day."
              - superscript [ref=e1986]:
                - link "[222]" [ref=e1987] [cursor=pointer]:
                  - /url: "#cite_note-223"
              - superscript [ref=e1988]:
                - link "[223]" [ref=e1989] [cursor=pointer]:
                  - /url: "#cite_note-224"
              - text: Cats are also used in the international
              - link "fur trade" [ref=e1990] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fur_trade
              - superscript [ref=e1991]:
                - link "[224]" [ref=e1992] [cursor=pointer]:
                  - /url: "#cite_note-225"
              - text: and leather industries for making coats, hats, blankets, stuffed toys,
              - superscript [ref=e1993]:
                - link "[225]" [ref=e1994] [cursor=pointer]:
                  - /url: "#cite_note-226"
              - text: shoes, gloves, and musical instruments.
              - superscript [ref=e1995]:
                - link "[226]" [ref=e1996] [cursor=pointer]:
                  - /url: "#cite_note-227"
              - text: About 24 cats are needed to make a cat-fur coat.
              - superscript [ref=e1997]:
                - link "[227]" [ref=e1998] [cursor=pointer]:
                  - /url: "#cite_note-228"
              - text: This use has been outlawed in the United States since 2000 and in the European Union (as well as the United Kingdom) since 2007.
              - superscript [ref=e1999]:
                - link "[228]" [ref=e2000] [cursor=pointer]:
                  - /url: "#cite_note-229"
            - paragraph [ref=e2001]:
              - text: Cat pelts have been used for superstitious purposes as part of the practice of
              - link "witchcraft" [ref=e2002] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Witchcraft
              - text: ","
              - superscript [ref=e2003]:
                - link "[229]" [ref=e2004] [cursor=pointer]:
                  - /url: "#cite_note-230"
              - text: and they are still made into blankets in Switzerland as
              - link "traditional medicines" [ref=e2005] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Traditional_medicine
              - text: thought to cure
              - link "rheumatism" [ref=e2006] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rheumatism
              - text: .
              - superscript [ref=e2007]:
                - link "[230]" [ref=e2008] [cursor=pointer]:
                  - /url: "#cite_note-231"
            - paragraph [ref=e2009]:
              - text: A few attempts to build a cat census have been made over the years, both through associations or national and international organizations (such as that of the
              - link "Canadian Federation of Humane Societies" [ref=e2010] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Canadian_Federation_of_Humane_Societies
              - superscript [ref=e2011]:
                - link "[231]" [ref=e2012] [cursor=pointer]:
                  - /url: "#cite_note-Canadian-232"
              - text: ) and over the Internet.
              - superscript [ref=e2013]:
                - link "[232]" [ref=e2014] [cursor=pointer]:
                  - /url: "#cite_note-catsbe-233"
              - superscript [ref=e2015]:
                - link "[233]" [ref=e2016] [cursor=pointer]:
                  - /url: "#cite_note-SupremeCatCensus-234"
              - text: General estimates for the global population of domestic cats range widely from anywhere between 200 million to 600 million.
              - superscript [ref=e2017]:
                - link "[234]" [ref=e2018] [cursor=pointer]:
                  - /url: "#cite_note-235"
              - superscript [ref=e2019]:
                - link "[235]" [ref=e2020] [cursor=pointer]:
                  - /url: "#cite_note-236"
              - superscript [ref=e2021]:
                - link "[236]" [ref=e2022] [cursor=pointer]:
                  - /url: "#cite_note-237"
              - superscript [ref=e2023]:
                - link "[237]" [ref=e2024] [cursor=pointer]:
                  - /url: "#cite_note-238"
              - superscript [ref=e2025]:
                - link "[238]" [ref=e2026] [cursor=pointer]:
                  - /url: "#cite_note-239"
              - link "Walter Chandoha" [ref=e2027] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Walter_Chandoha
              - text: made his career photographing cats after his 1949 images of Loco, a stray cat, were published. He is reported to have photographed 90,000 cats during his career and maintained an archive of 225,000 images that he drew from for publications during his lifetime.
              - superscript [ref=e2028]:
                - link "[239]" [ref=e2029] [cursor=pointer]:
                  - /url: "#cite_note-240"
            - paragraph [ref=e2030]:
              - link "Pet humanization" [ref=e2031] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Pet_humanization
              - text: is a form of
              - link "anthropomorphism" [ref=e2032] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Anthropomorphism
              - text: in which cats are kept for companionship and treated more like human family members than traditional pets.
              - superscript [ref=e2033]:
                - link "[240]" [ref=e2034] [cursor=pointer]:
                  - /url: "#cite_note-241"
              - text: This trend of
              - link "pet culture" [ref=e2035] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Pet_culture
              - text: involves providing cats with a higher level of care, attention and often even luxury, similar to the way humans are treated.
              - superscript [ref=e2036]:
                - link "[241]" [ref=e2037] [cursor=pointer]:
                  - /url: "#cite_note-242"
            - region [ref=e2038]:
              - heading "Shows" [level=3] [ref=e2040]
              - note [ref=e2041]:
                - text: "Main article:"
                - link "Cat show" [ref=e2042] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_show
              - paragraph [ref=e2043]:
                - text: A
                - link "cat show" [ref=e2044] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_show
                - text: is a judged event in which the owners of cats compete to win titles in various cat-registering organizations by entering their cats to be judged after a breed standard.
                - superscript [ref=e2045]:
                  - link "[242]" [ref=e2046] [cursor=pointer]:
                    - /url: "#cite_note-How_Stuff_Works-2008-243"
                - text: It is often required that a cat must be healthy and vaccinated to participate in a cat show.
                - superscript [ref=e2047]:
                  - link "[242]" [ref=e2048] [cursor=pointer]:
                    - /url: "#cite_note-How_Stuff_Works-2008-243"
                - text: Both
                - link "pedigreed" [ref=e2049] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pedigree_(cat)
                - text: and non-
                - link "purebred" [ref=e2050] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Purebred
                - text: companion ("moggy") cats are admissible, although the rules differ depending on the organization. Competing cats are compared to the applicable breed standard, and assessed for temperament.
                - superscript [ref=e2051]:
                  - link "[242]" [ref=e2052] [cursor=pointer]:
                    - /url: "#cite_note-How_Stuff_Works-2008-243"
            - region [ref=e2053]:
              - heading "Infection" [level=3] [ref=e2055]
              - note [ref=e2056]:
                - text: "Main article:"
                - link "Feline zoonosis" [ref=e2057] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Feline_zoonosis
              - paragraph [ref=e2058]:
                - text: Cats can be infected or infested with
                - link "viruses" [ref=e2059] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Virus
                - text: ","
                - link "pathogenic bacteria" [ref=e2060] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pathogenic_bacteria
                - text: ","
                - link "fungus" [ref=e2061] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fungus
                - text: ","
                - link "protozoans" [ref=e2062] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Protozoans
                - text: ","
                - link "arthropods" [ref=e2063] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Arthropod
                - text: or worms that can transmit diseases to humans; infections of most concern include
                - link "salmonella" [ref=e2064] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Salmonella
                - text: ","
                - link "cat-scratch disease" [ref=e2065] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat-scratch_disease
                - text: ", and"
                - link "toxoplasmosis" [ref=e2066] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Toxoplasmosis
                - text: .
                - superscript [ref=e2067]:
                  - link "[243]" [ref=e2068] [cursor=pointer]:
                    - /url: "#cite_note-Chomel2014-244"
                - text: In some cases, the cat exhibits no
                - link "symptoms" [ref=e2069] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Symptoms
                - text: of the disease.
                - superscript [ref=e2070]:
                  - link "[244]" [ref=e2071] [cursor=pointer]:
                    - /url: "#cite_note-Ohio2016-245"
                - text: The same disease can then become evident in a human.
                - superscript [ref=e2072]:
                  - link "[245]" [ref=e2073] [cursor=pointer]:
                    - /url: "#cite_note-Goldstein2015-246"
                - text: The likelihood that a person will become diseased depends on the age and
                - link "immune status" [ref=e2074] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Immunocompetence
                - text: of the person. Others might also acquire infections from cat
                - link "feces" [ref=e2075] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Feces
                - text: and
                - link "parasites" [ref=e2076] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Parasite
                - text: exiting the cat's body.
                - superscript [ref=e2077]:
                  - link "[243]" [ref=e2078] [cursor=pointer]:
                    - /url: "#cite_note-Chomel2014-244"
                - superscript [ref=e2079]:
                  - link "[246]" [ref=e2080] [cursor=pointer]:
                    - /url: "#cite_note-StullBrophy2015-247"
          - region [ref=e2081]:
            - heading "History and mythology" [level=2] [ref=e2083]
            - note [ref=e2084]:
              - text: "Main articles:"
              - link "Cultural depictions of cats" [ref=e2085] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cultural_depictions_of_cats
              - text: and
              - link "Cats in ancient Egypt" [ref=e2086] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cats_in_ancient_Egypt
            - generic [ref=e2088]:
              - generic [ref=e2090]:
                - link [ref=e2093] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Louvre_egyptologie_21.jpg
                - generic [ref=e2095]:
                  - text: The ancient Egyptians
                  - link "mummified" [ref=e2096] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Mummy
                  - text: dead cats out of respect in the same way that they mummified people.
                  - superscript [ref=e2097]:
                    - link "[247]" [ref=e2098] [cursor=pointer]:
                      - /url: "#cite_note-Clutton-Brock1999-248"
              - generic [ref=e2100]:
                - link [ref=e2103] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Cat_birds_MAN_Napoli_Inv9993.jpg
                - generic [ref=e2105]:
                  - text: An ancient
                  - link "Roman mosaic" [ref=e2106] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Roman_mosaic
                  - text: depicts a cat killing a
                  - link "partridge" [ref=e2107] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Partridge
                  - text: from the
                  - link "House of the Faun" [ref=e2108] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/House_of_the_Faun
                  - text: in
                  - link "Pompeii" [ref=e2109] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Pompeii
                  - text: .
              - generic [ref=e2111]:
                - link [ref=e2114] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:PSM_V37_D105_English_tabby_cat.jpg
                - generic [ref=e2116]: A 19th-century drawing of a tabby cat
              - generic [ref=e2118]:
                - link [ref=e2121] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Black_cat_on_blue.jpg
                - generic [ref=e2123]: Some cultures superstitiously attribute good or bad luck to black cats.
            - paragraph [ref=e2124]:
              - text: In
              - link "ancient Egypt" [ref=e2125] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ancient_Egypt
              - text: ", cats were"
              - link "revered" [ref=e2126] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Animal_worship
              - text: . The goddess
              - link "Bastet" [ref=e2127] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bastet
              - text: was often depicted in cat form, sometimes taking on the war-like aspect of a lioness. The Greek historian
              - link "Herodotus" [ref=e2128] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Herodotus
              - text: reported that killing a cat was forbidden, and when a household cat died, the entire family mourned and shaved their eyebrows. Families took their dead cats to the sacred city of
              - link "Bubastis" [ref=e2129] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bubastis
              - text: ", where they were embalmed and buried in sacred repositories. Herodotus expressed astonishment at the domestic cats in Egypt, because he had only ever seen wildcats."
              - superscript [ref=e2130]:
                - link "[248]" [ref=e2131] [cursor=pointer]:
                  - /url: "#cite_note-Malek1997-249"
            - paragraph [ref=e2132]:
              - text: Ancient Greeks and Romans kept
              - link "weasels" [ref=e2133] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Weasel
              - text: as pets, which were seen as the ideal rodent-killers. The earliest unmistakable evidence of the Greeks having domestic cats comes from two coins from
              - link "Magna Graecia" [ref=e2134] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Magna_Graecia
              - text: dating to the mid-fifth century BC showing Iokastos and Phalanthos, the legendary founders of
              - link "Rhegion" [ref=e2135] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Reggio_Calabria
              - text: and
              - link "Taras" [ref=e2136] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Taranto
              - text: respectively, playing with their pet cats. The usual ancient Greek word for 'cat' was
              - generic "Ancient Greek (to 1453)-language text" [ref=e2137]: ailouros
              - text: ", meaning 'thing with the waving tail'. Cats are rarely mentioned in"
              - link "ancient Greek literature" [ref=e2138] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ancient_Greek_literature
              - text: .
              - link "Aristotle" [ref=e2139] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Aristotle
              - text: remarked in his
              - link "History of Animals" [ref=e2141] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/History_of_Animals
              - text: that "female cats are naturally
              - link "lecherous" [ref=e2142] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Promiscuity
              - text: "\". The Greeks later"
              - link "syncretized" [ref=e2143] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Interpretatio_graeca
              - text: their own goddess
              - link "Artemis" [ref=e2144] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Artemis
              - text: with the Egyptian goddess Bastet, adopting Bastet's associations with cats and ascribing them to Artemis. In
              - link "Ovid" [ref=e2145] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ovid
              - text: "'s"
              - link "Metamorphoses" [ref=e2147] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Metamorphoses
              - text: ", when the deities flee to Egypt and take animal forms, the goddess"
              - link "Diana" [ref=e2148] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Diana_(mythology)
              - text: turns into a cat.
              - superscript [ref=e2149]:
                - link "[249]" [ref=e2150] [cursor=pointer]:
                  - /url: "#cite_note-Engels2001-250"
              - superscript [ref=e2151]:
                - link "[250]" [ref=e2152] [cursor=pointer]:
                  - /url: "#cite_note-251"
            - paragraph [ref=e2153]:
              - text: Cats eventually displaced
              - link "weasels" [ref=e2154] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Weasel
              - text: as the pest control of choice because they were more pleasant to have around the house and were more enthusiastic hunters of mice. During the
              - link "Middle Ages" [ref=e2155] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Middle_Ages
              - text: ", many of Artemis's associations with cats were grafted onto the"
              - link "Virgin Mary" [ref=e2156] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mary,_mother_of_Jesus
              - text: . Cats are often shown in icons of
              - link "Annunciation" [ref=e2157] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Annunciation
              - text: and of the
              - link "Holy Family" [ref=e2158] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Holy_Family
              - text: and, according to
              - link "Italian folklore" [ref=e2159] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Folklore_of_Italy
              - text: ", on the same night that Mary gave birth to"
              - link "Jesus" [ref=e2160] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Jesus
              - text: ", a cat in"
              - link "Bethlehem" [ref=e2161] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bethlehem
              - text: gave birth to a kitten.
              - superscript [ref=e2162]:
                - link "[251]" [ref=e2163] [cursor=pointer]:
                  - /url: "#cite_note-Beadle1977-252"
              - text: Domestic cats were spread throughout much of the rest of the world during the
              - link "Age of Discovery" [ref=e2164] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Age_of_Discovery
              - text: ", as"
              - link "ships' cats" [ref=e2165] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ship's_cat
              - text: were carried on
              - link "sailing ships" [ref=e2166] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sailing_ship
              - text: to control shipboard rodents and as
              - link "good-luck charms" [ref=e2167] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Amulet
              - text: .
              - superscript [ref=e2168]:
                - link "[43]" [ref=e2169] [cursor=pointer]:
                  - /url: "#cite_note-Faure2009-44"
            - paragraph [ref=e2170]:
              - text: Several ancient religions believed cats are exalted souls, companions or guides for humans, that are all-knowing but mute so they cannot influence decisions made by humans. In Japan, the
              - generic "Japanese-language text" [ref=e2171]:
                - link "maneki neko" [ref=e2173] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Maneki_neko
              - text: cat is a symbol of good fortune.
              - superscript [ref=e2174]:
                - link "[252]" [ref=e2175] [cursor=pointer]:
                  - /url: "#cite_note-253"
              - text: In
              - link "Norse mythology" [ref=e2176] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Norse_mythology
              - text: ","
              - link "Freyja" [ref=e2177] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Freyja
              - text: ", the goddess of love, beauty, and fertility, is depicted as riding a chariot drawn by cats."
              - superscript [ref=e2178]:
                - link "[253]" [ref=e2179] [cursor=pointer]:
                  - /url: "#cite_note-254"
              - text: In
              - link "Jewish legend" [ref=e2180] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Legends_of_the_Jews
              - text: ", the first cat was living in the house of the first man"
              - link "Adam" [ref=e2181] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Adam
              - text: as a pet that got rid of
              - link "mice" [ref=e2182] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mice
              - text: . The cat was once partnering with the first dog before the latter broke an oath they had made which resulted in enmity between the descendants of these two animals. It is also written that neither cats nor
              - link "foxes" [ref=e2183] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fox
              - text: are represented in the water, while every other animal has an incarnation species in the water.
              - superscript [ref=e2184]:
                - link "[254]" [ref=e2185] [cursor=pointer]:
                  - /url: "#cite_note-Ginzberg-255"
              - text: Although no species are sacred in Islam,
              - link "cats are revered by Muslims" [ref=e2186] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Islam_and_cats
              - text: . Some Western writers have stated
              - link "Muhammad" [ref=e2187] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Muhammad
              - text: had a favorite cat,
              - link "Muezza" [ref=e2189] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Muezza
              - text: .
              - superscript [ref=e2190]:
                - link "[255]" [ref=e2191] [cursor=pointer]:
                  - /url: "#cite_note-256"
              - text: He is reported to have loved cats so much, "he would do without his cloak rather than disturb one that was sleeping on it".
              - superscript [ref=e2192]:
                - link "[256]" [ref=e2193] [cursor=pointer]:
                  - /url: "#cite_note-Reeves-257"
              - text: The story has no origin in early Muslim writers, and seems to confuse a story of a later
              - link "Sufi" [ref=e2194] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sufi
              - text: saint,
              - link "Ahmed ar-Rifa'i" [ref=e2195] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ahmed_ar-Rifa'i
              - text: ", centuries after Muhammad."
              - superscript [ref=e2196]:
                - link "[257]" [ref=e2197] [cursor=pointer]:
                  - /url: "#cite_note-258"
              - text: One of the companions of Muhammad was known as
              - link "Abu Hurayrah" [ref=e2198] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Abu_Hurayrah
              - text: ("father of the kitten"), in reference to his documented affection to cats.
              - superscript [ref=e2199]:
                - link "[258]" [ref=e2200] [cursor=pointer]:
                  - /url: "#cite_note-259"
            - region [ref=e2201]:
              - heading "Superstitions and rituals" [level=3] [ref=e2203]
              - figure [ref=e2204]:
                - link [ref=e2205] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Evelyn_De_Morgan_-_The_Love_Potion_(1903)_-_Google_Cultural_Institute.jpg
                - generic [ref=e2207]:
                  - link "The Love Potion" [ref=e2209] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/The_Love_Potion
                  - text: is a 1903 painting by
                  - link "Evelyn De Morgan" [ref=e2210] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Evelyn_De_Morgan
                  - text: depicting a
                  - link "witch" [ref=e2211] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Witch
                  - text: with a black cat.
              - paragraph [ref=e2212]:
                - text: Many cultures have negative
                - link "superstitions" [ref=e2213] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Superstition
                - text: about cats. For example, that encountering a
                - link "black cat" [ref=e2214] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Black_cat
                - text: ("crossing one's path")
                - superscript [ref=e2215]:
                  - link "[259]" [ref=e2216] [cursor=pointer]:
                    - /url: "#cite_note-260"
                - text: leads to bad luck, or that cats are witches'
                - link "familiar spirits" [ref=e2217] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Familiar_spirit
                - text: used to augment a witch's powers and skills. The killing of cats in medieval
                - link "Ypres" [ref=e2218] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ypres
                - text: ", Belgium, is commemorated in the innocuous present-day"
                - link "Kattenstoet" [ref=e2219] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kattenstoet
                - text: (cat parade).
                - superscript [ref=e2220]:
                  - link "[260]" [ref=e2221] [cursor=pointer]:
                    - /url: "#cite_note-261"
              - paragraph [ref=e2222]:
                - text: According to a myth in many cultures, cats have multiple lives. In many countries, they are believed to have nine lives, but in Italy, Germany, Greece, Brazil, and some Spanish-speaking regions, they are said to have seven lives,
                - superscript [ref=e2223]:
                  - link "[261]" [ref=e2224] [cursor=pointer]:
                    - /url: "#cite_note-262"
                - superscript [ref=e2225]:
                  - link "[262]" [ref=e2226] [cursor=pointer]:
                    - /url: "#cite_note-263"
                - text: while in Arabic traditions, the number of lives is six.
                - superscript [ref=e2227]:
                  - link "[263]" [ref=e2228] [cursor=pointer]:
                    - /url: "#cite_note-264"
                - text: An early mention of the myth is in
                - link "John Heywood" [ref=e2229] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/John_Heywood
                - text: "'s The Proverbs of John Heywood (1546):"
                - superscript [ref=e2230]:
                  - link "[264]" [ref=e2231] [cursor=pointer]:
                    - /url: "#cite_note-265"
              - blockquote [ref=e2232]:
                - paragraph [ref=e2234]:
                  - text: Husband, (
                  - link "quoth" [ref=e2235] [cursor=pointer]:
                    - /url: https://en.wiktionary.org/wiki/quoth#Verb_2
                  - text: she), ye studie, be merrie now, And even as ye thinke now, so come to yow. Nay not so, (quoth he), for my thought to tell right, I thinke how you lay
                  - link "groning" [ref=e2236] [cursor=pointer]:
                    - /url: https://en.wiktionary.org/wiki/groning#English
                  - text: ", wife, all last night. Husband, a groning horse and a groning wife Never faile their master, (quoth she), for my life. No wife,"
                  - generic [ref=e2237]:
                    - text: a woman
                    - link "hath" [ref=e2238] [cursor=pointer]:
                      - /url: https://en.wiktionary.org/wiki/hath#English
                    - text: nine lives like a cat
                  - text: .
              - paragraph [ref=e2239]:
                - text: The myth is attributed to the natural suppleness and swiftness cats exhibit to escape life-threatening situations.
                - superscript [ref=e2240]:
                  - link "[265]" [ref=e2241] [cursor=pointer]:
                    - /url: "#cite_note-266"
                - text: Falling cats often land on their feet, using an instinctive
                - link "righting reflex" [ref=e2242] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cat_righting_reflex
                - text: to twist their bodies around.
                - superscript [ref=e2243]:
                  - link "[266]" [ref=e2244] [cursor=pointer]:
                    - /url: "#cite_note-267"
